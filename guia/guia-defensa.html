<title>Guía de defensa BETO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: columna de lectura con barra de secciones fija arriba; la arquitectura se recorre como una "pila" de etapas que se despliega. */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eceef6; --fg:#171a2b; --muted:#5b6078; --line:#d9dcea;
  --accent:#3343c7; --accent-soft:#e3e6fb;
  --neg:#c8443a; --neu:#b98a12; --pos:#1f8a5b;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#171b2e; --surface-2:#20253c; --fg:#e8eaf4; --muted:#9aa0bd; --line:#2c3250;
  --accent:#8c98ff; --accent-soft:#252c55; --neg:#f07a6f; --neu:#e2b54a; --pos:#4fc792; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2e; --surface-2:#20253c; --fg:#e8eaf4; --muted:#9aa0bd; --line:#2c3250;
  --accent:#8c98ff; --accent-soft:#252c55; --neg:#f07a6f; --neu:#e2b54a; --pos:#4fc792; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--font-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.85rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0;max-width:68ch}
code,.mono{font-family:var(--font-mono);font-size:.88em}
a{color:var(--accent)}
.eyebrow{font:600 .74rem/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* navegación */
nav.secciones{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.secciones .in{max-width:980px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;scrollbar-width:none}
nav.secciones a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;font-size:.92rem;padding:7px 12px;border-radius:8px}
nav.secciones a:hover{color:var(--fg);background:var(--surface-2)}
nav.secciones a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
section.vista{display:grid;gap:28px;padding-top:40px}
.bloque{display:grid;gap:14px}
.lead{font-size:1.15rem;color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid2>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px}
.kpi b{font:700 1.9rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.88rem}
.pill{display:inline-block;font:600 .78rem/1 var(--font-body);padding:5px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.c-neg{color:var(--neg)} .c-neu{color:var(--neu)} .c-pos{color:var(--pos)}
ul.limpia{margin:0;padding-left:1.1em;display:grid;gap:6px;max-width:68ch}
.tabla{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.94rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--font-mono)}
tr.destacada td{background:var(--accent-soft)}
/* pipeline */
.pipeline{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.pipeline .paso{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;min-width:0}
.pipeline .paso small{color:var(--muted)}
/* explorador de arquitectura */
.arq{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.arq{grid-template-columns:1fr}}
.pila{display:grid;gap:6px}
.pila button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.94rem}
.pila button:hover{border-color:var(--accent)}
.pila button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pila button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.pila .n{font:600 .8rem/1 var(--font-mono);color:var(--muted)}
.pila .forma{font:400 .74rem/1 var(--font-mono);color:var(--muted)}
.pila .x12{border-style:dashed}
.detalle{display:grid;gap:14px;position:sticky;top:70px}
.detalle .forma-grande{font-family:var(--font-mono);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.88rem;overflow-x:auto}
.fila-tokens{display:flex;flex-wrap:wrap;gap:4px}
.tok{font-family:var(--font-mono);font-size:.82rem;padding:3px 7px;border-radius:6px;background:var(--surface-2)}
/* gráficos */
.grafico{width:100%;height:auto;display:block}
.grafico text{fill:var(--muted);font-family:var(--font-body);font-size:12px}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;font-size:.88rem;color:var(--muted)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.control{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.control button{font:500 .88rem var(--font-body);padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.control button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.control button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.matriz{display:grid;grid-template-columns:auto repeat(3,minmax(54px,1fr));gap:3px;font-variant-numeric:tabular-nums;font-size:.86rem;max-width:380px}
.matriz div{padding:9px 6px;text-align:center;border-radius:5px}
.matriz .h{color:var(--muted);font-size:.76rem}
/* preguntas */
.filtros{display:flex;flex-wrap:wrap;gap:6px}
.pregunta{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pregunta summary{cursor:pointer;list-style:none;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-weight:600}
.pregunta summary::-webkit-details-marker{display:none}
.pregunta summary::after{content:"+";font:400 1.3rem/1 var(--font-mono);color:var(--muted)}
.pregunta[open] summary::after{content:"–"}
.pregunta summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.pregunta .resp{padding:0 16px 16px;display:grid;gap:10px;color:var(--fg)}
.pregunta .resp p{max-width:72ch}
.pregunta .tip{font-size:.9rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.lista-preguntas{display:grid;gap:8px}
.examen{display:grid;gap:14px;text-align:left}
.examen .tarjeta{min-height:150px;display:grid;align-content:center;gap:12px;padding:24px}
.examen .q{font:700 1.35rem/1.3 var(--font-display)}
.barra-progreso{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.barra-progreso i{display:block;height:100%;background:var(--accent);transition:width .25s}
dl.glosario{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:10px 18px;margin:0}
dl.glosario dt{font-weight:600}
dl.glosario dd{margin:0;color:var(--muted)}
@media (max-width:560px){dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
.guion{counter-reset:paso;display:grid;gap:12px}
.guion li{list-style:none;display:grid;grid-template-columns:72px 1fr;gap:12px}
.guion .t{font:600 .85rem/1.6 var(--font-mono);color:var(--accent)}
.aviso{border:1px dashed var(--neu);border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--neu) 8%,transparent)}
.simple{border-radius:10px;padding:12px 14px;background:var(--accent-soft);display:grid;gap:6px}
.simple b.et{font:600 .72rem/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.capitulo{display:grid;gap:12px;padding-top:8px;border-top:1px solid var(--line);scroll-margin-top:70px}
.capitulo .num{font:600 .8rem/1 var(--font-mono);color:var(--accent)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.trio>div{min-width:0;display:grid;gap:4px;align-content:start}
.trio .eyebrow{color:var(--accent)}
.indice{display:flex;flex-wrap:wrap;gap:6px}
.indice a{font-size:.88rem;text-decoration:none;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--fg)}
.indice a:hover{border-color:var(--accent)}
#neurona textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical}
.barra-neurona{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--neg),var(--neu),var(--pos));position:relative}
.barra-neurona i{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--fg);transition:left .25s}
.bloque-codigo{display:grid;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.bloque-codigo .cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bloque-codigo .explica{display:grid;gap:4px;max-width:72ch}
pre.codigo{margin:0;background:var(--surface-2);border-radius:10px;padding:12px 14px;overflow-x:auto;font:400 .8rem/1.55 var(--font-mono);color:var(--fg)}
pre.codigo .ln{display:inline-block;width:3ch;margin-right:12px;text-align:right;color:var(--muted);user-select:none}
button.siguiente{justify-self:start;font:500 .92rem var(--font-body);padding:9px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.formula{font-family:var(--font-mono);background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

\nRAIZ = Path(__file__).resolve().parent.parent\nDATA_RAW = RAIZ / \"data\" / \"raw\" / \"Rest-Mex_2025_train.csv\"\nDATA_PROC = RAIZ / \"data\" / \"processed\"\nDATA_EXTERNO = RAIZ / \"data\" / \"externo\" / \"resenas_google_colombia.csv\"\nRESULTADOS = RAIZ / \"resultados\"\nMODELOS = RAIZ / \"modelos\"\n\nSEMILLA = 42\n\n# Agrupación de estrellas en tres clases de sentimiento.\n#   1-2 estrellas -> negativo, 3 -> neutral, 4-5 -> positivo\nETIQUETAS = [\"negativo\", \"neutral\", \"positivo\"]\nID2LABEL = {i: e for i, e in enumerate(ETIQUETAS)}\nLABEL2ID = {e: i for i, e in enumerate(ETIQUETAS)}\n\n\ndef estrellas_a_clase(estrellas: float) -> int:\n    if estrellas <= 2:\n        return 0\n    if estrellas == 3:\n        return 1\n    return 2\n\n\n# Corpus balanceado: N reseñas por clase (la clase negativa limita: ~10.9k).\nPOR_CLASE = 10_000\n\nMODELOS_HF = {\n    \"beto\": \"dccuchile/bert-base-spanish-wwm-cased\",\n    \"mdistilbert\": \"distilbert-base-multilingual-cased\",\n}\n", "preparar_datos.py": "\"\"\"Etapa 1 — Construcción y preprocesamiento del corpus.\n\n- Carga Rest-Mex 2025 (TripAdvisor, México; CC-BY-4.0).\n- Repara codificación rota (mojibake tipo \"CancÃºn\") con ftfy.\n- Une título + reseña, elimina duplicados y textos vacíos.\n- Agrupa estrellas en 3 clases (1-2 neg, 3 neu, 4-5 pos).\n- Submuestrea de forma balanceada (POR_CLASE por clase) y divide\n  estratificado 70/15/15 (estratificando por clase y tipo de negocio).\n- Guarda además un \"test natural\" con la distribución real (muy sesgada\n  a positivos) usando reseñas que NO entraron al corpus balanceado.\n\"\"\"\nimport json\n\nimport ftfy\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\n\nfrom config import DATA_PROC, DATA_RAW, ETIQUETAS, POR_CLASE, SEMILLA, estrellas_a_clase\n\n\ndef limpiar(texto: str) -> str:\n    texto = ftfy.fix_text(str(texto))\n    return \" \".join(texto.split())  # normaliza espacios / saltos de línea\n\n\ndef main() -> None:\n    df = pd.read_csv(DATA_RAW)\n    n_original = len(df)\n\n    df[\"Title\"] = df[\"Title\"].fillna(\"\")\n    df[\"texto\"] = (df[\"Title\"].map(limpiar) + \". \" + df[\"Review\"].map(limpiar)).str.strip(\". \")\n    df = df[df[\"texto\"].str.len() > 10]\n    df = df.drop_duplicates(subset=\"texto\")\n    df[\"label\"] = df[\"Polarity\"].map(estrellas_a_clase)\n    df[\"estrellas\"] = df[\"Polarity\"].astype(int)\n    df = df.rename(columns={\"Type\": \"tipo\"})[[\"texto\", \"label\", \"estrellas\", \"tipo\", \"Town\"]]\n\n    dist_real = df[\"label\"].value_counts(normalize=True).sort_index()\n\n    # Corpus balanceado\n    partes = [g.sample(n=min(POR_CLASE, len(g)), random_state=SEMILLA) for _, g in df.groupby(\"label\")]\n    bal = pd.concat(partes).sample(frac=1, random_state=SEMILLA)\n    estrato = bal[\"label\"].astype(str) + \"_\" + bal[\"tipo\"]\n\n    train, temp = train_test_split(bal, test_size=0.30, stratify=estrato, random_state=SEMILLA)\n    estrato_temp = temp[\"label\"].astype(str) + \"_\" + temp[\"tipo\"]\n    val, test = train_test_split(temp, test_size=0.50, stratify=estrato_temp, random_state=SEMILLA)\n\n    # Test con distribución natural, sin reseñas usadas en el corpus balanceado\n    resto = df.drop(index=bal.index)\n    n_nat = 10_000\n    nat_partes = []\n    for lab, prop in dist_real.items():\n        g = resto[resto[\"label\"] == lab]\n        nat_partes.append(g.sample(n=min(len(g), round(n_nat * prop)), random_state=SEMILLA))\n    test_natural = pd.concat(nat_partes).sample(frac=1, random_state=SEMILLA)\n\n    DATA_PROC.mkdir(parents=True, exist_ok=True)\n    for nombre, parte in [(\"train\", train), (\"val\", val), (\"test\", test), (\"test_natural\", test_natural)]:\n        parte.to_csv(DATA_PROC / f\"{nombre}.csv\", index=False)\n\n    resumen = {\n        \"n_original\": n_original,\n        \"n_tras_limpieza\": len(df),\n        \"distribucion_real\": {ETIQUETAS[k]: round(v, 4) for k, v in dist_real.items()},\n        \"distribucion_estrellas\": df[\"estrellas\"].value_counts().sort_index().to_dict(),\n        \"por_clase\": POR_CLASE,\n        \"tamanos\": {\"train\": len(train), \"val\": len(val), \"test\": len(test), \"test_natural\": len(test_natural)},\n        \"test_natural_dist\": test_natural[\"label\"].map(lambda i: ETIQUETAS[i]).value_counts().to_dict(),\n        \"longitud_caracteres\": bal[\"texto\"].str.len().describe().round(1).to_dict(),\n        \"tipos\": bal[\"tipo\"].value_counts().to_dict(),\n    }\n    (DATA_PROC / \"resumen_datos.json\").write_text(json.dumps(resumen, indent=2, ensure_ascii=False), encoding=\"utf-8\")\n    print(json.dumps(resumen, indent=2, ensure_ascii=False))\n\n\nif __name__ == \"__main__\":\n    main()\n", "metricas.py": "\"\"\"Métricas comunes a todos los modelos.\"\"\"\nimport numpy as np\nfrom sklearn.metrics import accuracy_score, confusion_matrix, f1_score, precision_recall_fscore_support\n\nfrom config import ETIQUETAS\n\n\ndef calcular(y_true, y_pred) -> dict:\n    y_true, y_pred = np.asarray(y_true), np.asarray(y_pred)\n    p, r, f, s = precision_recall_fscore_support(y_true, y_pred, labels=[0, 1, 2], zero_division=0)\n    return {\n        \"accuracy\": round(float(accuracy_score(y_true, y_pred)), 4),\n        \"f1_macro\": round(float(f1_score(y_true, y_pred, average=\"macro\", labels=[0, 1, 2], zero_division=0)), 4),\n        \"por_clase\": {\n            ETIQUETAS[i]: {\"precision\": round(float(p[i]), 4), \"recall\": round(float(r[i]), 4),\n                           \"f1\": round(float(f[i]), 4), \"soporte\": int(s[i])}\n            for i in range(3)\n        },\n        \"matriz_confusion\": confusion_matrix(y_true, y_pred, labels=[0, 1, 2]).tolist(),\n    }\n", "baseline_tfidf.py": "\"\"\"Etapa 2a — Baseline clásico: TF-IDF (palabras 1-2 gramas) + Regresión logística.\"\"\"\nimport json\nimport time\n\nimport pandas as pd\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.pipeline import make_pipeline\n\nimport metricas\nfrom config import DATA_PROC, RESULTADOS\nfrom externo import cargar_externo\n\n\ndef main():\n    train = pd.read_csv(DATA_PROC / \"train.csv\")\n    modelo = make_pipeline(\n        TfidfVectorizer(ngram_range=(1, 2), min_df=2, max_features=200_000, sublinear_tf=True, lowercase=True),\n        LogisticRegression(C=4.0, max_iter=2000),\n    )\n    t0 = time.time()\n    modelo.fit(train[\"texto\"], train[\"label\"])\n    salida = {\"modelo\": \"TF-IDF + Regresión logística\", \"segundos_entrenamiento\": round(time.time() - t0, 1)}\n\n    for nombre in [\"val\", \"test\", \"test_natural\"]:\n        df = pd.read_csv(DATA_PROC / f\"{nombre}.csv\")\n        salida[nombre] = metricas.calcular(df[\"label\"], modelo.predict(df[\"texto\"]))\n    ext = cargar_externo()\n    if ext is not None:\n        salida[\"externo_colombia\"] = metricas.calcular(ext[\"label\"], modelo.predict(ext[\"texto\"]))\n\n    # Palabras más influyentes por clase (interpretabilidad del baseline)\n    vec, clf = modelo.named_steps[\"tfidfvectorizer\"], modelo.named_steps[\"logisticregression\"]\n    vocab = vec.get_feature_names_out()\n    salida[\"top_terminos\"] = {\n        clase: [vocab[j] for j in clf.coef_[i].argsort()[::-1][:15]]\n        for i, clase in enumerate([\"negativo\", \"neutral\", \"positivo\"])\n    }\n\n    RESULTADOS.mkdir(exist_ok=True)\n    (RESULTADOS / \"tfidf.json\").write_text(json.dumps(salida, indent=2, ensure_ascii=False), encoding=\"utf-8\")\n    print(json.dumps({k: (v[\"f1_macro\"] if isinstance(v, dict) and \"f1_macro\" in v else v)\n                      for k, v in salida.items() if k != \"top_terminos\"}, indent=2, ensure_ascii=False))\n    return modelo\n\n\nif __name__ == \"__main__\":\n    main()\n", "entrenar_transformer.py": "\"\"\"Etapa 2b — Fine-tuning de un Transformer (BETO o DistilBERT multilingüe) con la API Trainer.\n\nUso:\n    python src/entrenar_transformer.py --modelo beto --lr 3e-5 --epocas 4 --max_len 128\n    python src/entrenar_transformer.py --modelo mdistilbert --lr 5e-5\n\nCada corrida guarda en resultados/<nombre>/:\n    metricas.json   (val / test / test_natural / externo)\n    historial.json  (pérdida de entrenamiento y validación + F1 por época -> curvas)\n    predicciones_test.csv\ny el mejor checkpoint (por F1 macro de validación) en modelos/<nombre>/ si --guardar.\n\"\"\"\nimport argparse\nimport json\nimport time\n\nimport numpy as np\nimport pandas as pd\nimport torch\nfrom datasets import Dataset\nfrom transformers import (\n    AutoModelForSequenceClassification,\n    AutoTokenizer,\n    DataCollatorWithPadding,\n    EarlyStoppingCallback,\n    Trainer,\n    TrainingArguments,\n    set_seed,\n)\n\nimport metricas\nfrom config import DATA_PROC, ID2LABEL, LABEL2ID, MODELOS, MODELOS_HF, RESULTADOS, SEMILLA\nfrom externo import cargar_externo\n\n\ndef args_cli():\n    p = argparse.ArgumentParser()\n    p.add_argument(\"--modelo\", choices=list(MODELOS_HF), default=\"beto\")\n    p.add_argument(\"--lr\", type=float, default=3e-5)\n    p.add_argument(\"--epocas\", type=int, default=4)\n    p.add_argument(\"--max_len\", type=int, default=128)\n    p.add_argument(\"--batch\", type=int, default=32)\n    p.add_argument(\"--guardar\", action=\"store_true\", help=\"Guarda el mejor modelo en modelos/\")\n    p.add_argument(\"--nombre\", default=None)\n    return p.parse_args()\n\n\ndef main() -> None:\n    a = args_cli()\n    set_seed(SEMILLA)\n    nombre = a.nombre or f\"{a.modelo}_lr{a.lr:g}_len{a.max_len}\"\n    out_res = RESULTADOS / nombre\n    out_res.mkdir(parents=True, exist_ok=True)\n    checkpoints = MODELOS / \"_checkpoints\" / nombre\n\n    checkpoint_hf = MODELOS_HF[a.modelo]\n    tok = AutoTokenizer.from_pretrained(checkpoint_hf)\n    modelo = AutoModelForSequenceClassification.from_pretrained(\n        checkpoint_hf, num_labels=3, id2label=ID2LABEL, label2id=LABEL2ID\n    )\n\n    def a_dataset(df: pd.DataFrame) -> Dataset:\n        ds = Dataset.from_pandas(df[[\"texto\", \"label\"]].rename(columns={\"label\": \"labels\"}), preserve_index=False)\n        return ds.map(lambda b: tok(b[\"texto\"], truncation=True, max_length=a.max_len), batched=True,\n                      remove_columns=[\"texto\"])\n\n    splits = {n: pd.read_csv(DATA_PROC / f\"{n}.csv\") for n in [\"train\", \"val\", \"test\", \"test_natural\"]}\n    ds = {n: a_dataset(df) for n, df in splits.items()}\n\n    # Cuántas reseñas superan max_len tokens (justifica la elección de longitud)\n    largos = [len(x) for x in ds[\"train\"][\"input_ids\"]]\n    truncadas = float(np.mean([l >= a.max_len for l in largos]))\n\n    def compute_metrics(pred):\n        y_pred = pred.predictions.argmax(-1)\n        m = metricas.calcular(pred.label_ids, y_pred)\n        return {\"accuracy\": m[\"accuracy\"], \"f1_macro\": m[\"f1_macro\"]}\n\n    targs = TrainingArguments(\n        output_dir=str(checkpoints),\n        learning_rate=a.lr,\n        num_train_epochs=a.epocas,\n        per_device_train_batch_size=a.batch,\n        per_device_eval_batch_size=a.batch * 2,\n        weight_decay=0.01,\n        warmup_steps=0.1,  # en Transformers 5 un float < 1 es fracción de los pasos (warmup del 10%)\n        lr_scheduler_type=\"linear\",\n        eval_strategy=\"steps\",\n        eval_steps=200,\n        save_strategy=\"steps\",\n        save_steps=200,\n        save_total_limit=1,\n        load_best_model_at_end=True,\n        metric_for_best_model=\"f1_macro\",\n        greater_is_better=True,\n        logging_steps=50,\n        fp16=torch.cuda.is_available(),\n        seed=SEMILLA,\n        report_to=\"none\",\n        dataloader_num_workers=0,\n    )\n    trainer = Trainer(\n        model=modelo,\n        args=targs,\n        train_dataset=ds[\"train\"],\n        eval_dataset=ds[\"val\"],\n        processing_class=tok,\n        data_collator=DataCollatorWithPadding(tok),\n        compute_metrics=compute_metrics,\n        callbacks=[EarlyStoppingCallback(early_stopping_patience=4)],\n    )\n\n    t0 = time.time()\n    trainer.train()\n    segundos = time.time() - t0\n\n    salida = {\n        \"modelo\": checkpoint_hf,\n        \"hiperparametros\": {\"lr\": a.lr, \"epocas_max\": a.epocas, \"max_len\": a.max_len, \"batch\": a.batch,\n                            \"weight_decay\": 0.01, \"warmup_ratio\": 0.1, \"fp16\": targs.fp16},\n        \"parametros_entrenables\": sum(p.numel() for p in modelo.parameters() if p.requires_grad),\n        \"fraccion_truncada_train\": round(truncadas, 4),\n        \"segundos_entrenamiento\": round(segundos, 1),\n        \"mejor_checkpoint\": trainer.state.best_model_checkpoint,\n        \"mejor_f1_val\": trainer.state.best_metric,\n        \"gpu\": torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"cpu\",\n    }\n\n    for n in [\"val\", \"test\", \"test_natural\"]:\n        pred = trainer.predict(ds[n])\n        y_pred = pred.predictions.argmax(-1)\n        salida[n] = metricas.calcular(splits[n][\"label\"], y_pred)\n        if n == \"test\":\n            probs = torch.softmax(torch.tensor(pred.predictions, dtype=torch.float32), -1).numpy()\n            df = splits[n].copy()\n            df[\"pred\"] = y_pred\n            df[[\"p_neg\", \"p_neu\", \"p_pos\"]] = probs\n            df.to_csv(out_res / \"predicciones_test.csv\", index=False)\n\n    ext = cargar_externo()\n    if ext is not None:\n        ds_ext = a_dataset(ext)\n        pred = trainer.predict(ds_ext)\n        salida[\"externo_colombia\"] = metricas.calcular(ext[\"label\"], pred.predictions.argmax(-1))\n\n    (out_res / \"metricas.json\").write_text(json.dumps(salida, indent=2, ensure_ascii=False), encoding=\"utf-8\")\n    (out_res / \"historial.json\").write_text(json.dumps(trainer.state.log_history, indent=2), encoding=\"utf-8\")\n\n    if a.guardar:\n        destino = MODELOS / nombre\n        trainer.save_model(str(destino))\n        tok.save_pretrained(str(destino))\n\n    print(json.dumps({k: salida[k][\"f1_macro\"] if isinstance(salida[k], dict) and \"f1_macro\" in salida[k]\n                      else salida[k] for k in salida}, indent=2, ensure_ascii=False))\n\n\nif __name__ == \"__main__\":\n    main()\n", "analisis_capas.py": "\"\"\"Etapa 3b — Análisis de las ETAPAS INTERMEDIAS de BETO.\n\nPara cada una de las 13 salidas internas (embeddings + 12 capas encoder) se extrae el\nvector [CLS] y se mide qué tan separables son las tres clases con una sonda lineal\n(regresión logística entrenada sobre ese vector congelado). Se compara:\n  - BETO preentrenado (sin fine-tuning)  -> qué \"sabe\" el modelo de fábrica\n  - BETO ajustado (fine-tuned)           -> qué aprendió con nuestras reseñas\nAdemás guarda proyecciones PCA 2D por capa y la atención del [CLS] en la última capa\npara algunos ejemplos.\n\nUso: python src/analisis_capas.py --modelo_ft modelos/beto_final\n\"\"\"\nimport argparse\nimport json\n\nimport numpy as np\nimport pandas as pd\nimport torch\nfrom sklearn.decomposition import PCA\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import f1_score\nfrom sklearn.model_selection import train_test_split\nfrom transformers import AutoModel, AutoTokenizer\n\nfrom config import DATA_PROC, MODELOS_HF, RESULTADOS, SEMILLA\n\nN_POR_CLASE = 700\nCAPAS_PCA = [1, 3, 6, 9, 12]  # la capa 0 no: ahí el [CLS] es idéntico para todas las reseñas\nEJEMPLOS_ATENCION = [\n    \"La comida estaba deliciosa y el servicio fue excelente, sin duda volveremos.\",\n    \"El lugar es bonito pero la atención fue lenta y la comida llegó fría.\",\n    \"Pésima experiencia, nos cobraron de más y el mesero fue grosero.\",\n    \"Está bien, nada del otro mundo. Precios normales.\",\n]\n\n\n@torch.no_grad()\ndef cls_por_capa(ruta, textos, tok, dispositivo, max_len=256, lote=32):\n    modelo = AutoModel.from_pretrained(ruta, output_hidden_states=True, attn_implementation=\"eager\").to(dispositivo).eval()\n    salidas = []\n    for i in range(0, len(textos), lote):\n        enc = tok(textos[i:i + lote], truncation=True, max_length=max_len, padding=True, return_tensors=\"pt\").to(dispositivo)\n        hs = modelo(**enc).hidden_states  # tupla de 13 tensores [B, T, 768]\n        salidas.append(torch.stack([h[:, 0, :] for h in hs], dim=1).float().cpu())  # [B, 13, 768]\n    return modelo, torch.cat(salidas).numpy()\n\n\n@torch.no_grad()\ndef atencion_cls(modelo, tok, dispositivo):\n    resultado = []\n    for texto in EJEMPLOS_ATENCION:\n        enc = tok(texto, return_tensors=\"pt\").to(dispositivo)\n        out = modelo(**enc, output_attentions=True)\n        att = out.attentions[-1][0].mean(0)[0]  # última capa, promedio de 12 cabezas, fila del [CLS]\n        tokens = tok.convert_ids_to_tokens(enc[\"input_ids\"][0])\n        resultado.append({\"texto\": texto, \"tokens\": tokens, \"pesos\": [round(float(x), 4) for x in att.cpu()]})\n    return resultado\n\n\ndef sondas(X, y):\n    idx_tr, idx_te = train_test_split(np.arange(len(y)), test_size=0.3, stratify=y, random_state=SEMILLA)\n    f1s = []\n    for capa in range(X.shape[1]):\n        clf = LogisticRegression(max_iter=3000, C=1.0)\n        clf.fit(X[idx_tr, capa], y[idx_tr])\n        f1s.append(round(float(f1_score(y[idx_te], clf.predict(X[idx_te, capa]), average=\"macro\")), 4))\n    return f1s\n\n\ndef pca_por_capa(X, y, n_puntos=450):\n    idx = np.random.RandomState(SEMILLA).choice(len(y), n_puntos, replace=False)\n    res = {}\n    for capa in CAPAS_PCA:\n        P = PCA(n_components=2, random_state=SEMILLA).fit_transform(X[idx, capa])\n        P = P / np.abs(P).max(0)\n        res[str(capa)] = [[round(float(a), 3), round(float(b), 3), int(c)] for (a, b), c in zip(P, y[idx])]\n    return res\n\n\ndef main():\n    p = argparse.ArgumentParser()\n    p.add_argument(\"--modelo_ft\", required=True)\n    a = p.parse_args()\n    disp = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n\n    test = pd.read_csv(DATA_PROC / \"test.csv\")\n    muestra = pd.concat([g.sample(N_POR_CLASE, random_state=SEMILLA) for _, g in test.groupby(\"label\")])\n    textos, y = muestra[\"texto\"].tolist(), muestra[\"label\"].to_numpy()\n\n    tok = AutoTokenizer.from_pretrained(a.modelo_ft)\n    _, X_pre = cls_por_capa(MODELOS_HF[\"beto\"], textos, tok, disp)\n    modelo_ft, X_ft = cls_por_capa(a.modelo_ft, textos, tok, disp)\n\n    salida = {\n        \"capas\": [\"embeddings\"] + [f\"capa {i}\" for i in range(1, 13)],\n        \"sonda_f1_preentrenado\": sondas(X_pre, y),\n        \"sonda_f1_finetuned\": sondas(X_ft, y),\n        \"pca_finetuned\": pca_por_capa(X_ft, y),\n        \"pca_preentrenado\": pca_por_capa(X_pre, y),\n        \"atencion\": atencion_cls(modelo_ft, tok, disp),\n    }\n    (RESULTADOS / \"capas.json\").write_text(json.dumps(salida, ensure_ascii=False), encoding=\"utf-8\")\n    print(\"preentrenado:\", salida[\"sonda_f1_preentrenado\"])\n    print(\"fine-tuned:  \", salida[\"sonda_f1_finetuned\"])\n\n\nif __name__ == \"__main__\":\n    main()\n", "evaluar_externo.py": "\"\"\"Etapa 3c — Evaluación de los tres modelos en el conjunto externo colombiano.\n\nActualiza el bloque \"externo_colombia\" de resultados/<corrida>/metricas.json y\nresultados/tfidf.json, y guarda las predicciones de BETO por reseña con el análisis\npor tipo de negocio y por ciudad.\n\nUso: python src/evaluar_externo.py\n\"\"\"\nimport json\n\nimport pandas as pd\nimport torch\nfrom transformers import pipeline\n\nimport metricas\nimport numpy as np\nfrom sklearn.metrics import f1_score\n\nfrom config import ETIQUETAS, RESULTADOS, SEMILLA\nfrom externo import cargar_externo\n\n\ndef predecir(ruta, textos, max_len=128):\n    clf = pipeline(\"text-classification\", model=str(ruta), device=0 if torch.cuda.is_available() else -1,\n                   truncation=True, max_length=max_len, top_k=None)\n    salidas = clf(textos, batch_size=32)\n    preds, probs = [], []\n    for s in salidas:\n        d = {x[\"label\"]: x[\"score\"] for x in s}\n        p = [d[e] for e in ETIQUETAS]\n        probs.append(p)\n        preds.append(int(max(range(3), key=lambda i: p[i])))\n    return preds, probs\n\n\ndef actualizar(json_path, bloque):\n    m = json.loads(json_path.read_text(encoding=\"utf-8\"))\n    m[\"externo_colombia\"] = bloque\n    json_path.write_text(json.dumps(m, indent=2, ensure_ascii=False), encoding=\"utf-8\")\n\n\ndef main():\n    ext = cargar_externo()\n    if ext is None:\n        raise SystemExit(\"No hay data/externo/resenas_google_colombia.csv con filas etiquetadas.\")\n    final = json.loads((RESULTADOS / \"beto_final.json\").read_text(encoding=\"utf-8\"))\n    textos = ext[\"texto\"].tolist()\n    resumen = {}\n    df = ext.copy()\n    todas = {}\n\n    for clave, corrida in [(\"beto\", final[\"corrida\"]), (\"mdistilbert\", final[\"corrida_mdistilbert\"])]:\n        m = json.loads((RESULTADOS / corrida / \"metricas.json\").read_text(encoding=\"utf-8\"))\n        preds, probs = predecir(m[\"mejor_checkpoint\"], textos, m[\"hiperparametros\"][\"max_len\"])\n        todas[clave] = np.array(preds)\n        bloque = metricas.calcular(ext[\"label\"], preds)\n        if clave == \"beto\":\n            df[\"pred\"] = [ETIQUETAS[p] for p in preds]\n            df[[\"p_neg\", \"p_neu\", \"p_pos\"]] = probs\n            for col in [\"tipo_negocio\", \"ciudad\"]:\n                if col in df:\n                    bloque[f\"por_{col}\"] = {\n                        str(k): {\"n\": len(g), \"accuracy\": round(float((g[\"pred\"] == g[\"etiqueta\"]).mean()), 4)}\n                        for k, g in df.groupby(col)\n                    }\n            # acuerdo entre la etiqueta manual y la regla de estrellas\n            if \"estrellas\" in df:\n                regla = df[\"estrellas\"].map(lambda s: \"negativo\" if s <= 2 else \"neutral\" if s == 3 else \"positivo\")\n                bloque[\"acuerdo_manual_vs_estrellas\"] = round(float((regla == df[\"etiqueta\"]).mean()), 4)\n        actualizar(RESULTADOS / corrida / \"metricas.json\", bloque)\n        resumen[clave] = bloque[\"f1_macro\"]\n\n    # baseline TF-IDF: se reentrena rápido para no depender de un pickle\n    import baseline_tfidf\n    tfidf = baseline_tfidf.main()\n    todas[\"tfidf\"] = np.asarray(tfidf.predict(ext[\"texto\"]))\n    resumen[\"tfidf\"] = json.loads((RESULTADOS / \"tfidf.json\").read_text(encoding=\"utf-8\"))[\"externo_colombia\"][\"f1_macro\"]\n\n    df[\"pred_mdistilbert\"] = [ETIQUETAS[p] for p in todas[\"mdistilbert\"]]\n    df[\"pred_tfidf\"] = [ETIQUETAS[p] for p in todas[\"tfidf\"]]\n    df.to_csv(RESULTADOS / \"predicciones_externo.csv\", index=False)\n\n    # Bootstrap (2000 remuestreos): intervalo del 95% del F1 macro y de la diferencia BETO - otro.\n    # Con ~170 reseñas, diferencias pequeñas entre modelos pueden ser solo azar del muestreo.\n    y = ext[\"label\"].to_numpy()\n    rng = np.random.default_rng(SEMILLA)\n    f1 = lambda yt, yp: f1_score(yt, yp, average=\"macro\", labels=[0, 1, 2], zero_division=0)\n    muestras = {k: [] for k in todas}\n    difs = {k: [] for k in todas if k != \"beto\"}\n    for _ in range(2000):\n        idx = rng.integers(0, len(y), len(y))\n        v = {k: f1(y[idx], p[idx]) for k, p in todas.items()}\n        for k in todas:\n            muestras[k].append(v[k])\n        for k in difs:\n            difs[k].append(v[\"beto\"] - v[k])\n    ic = lambda a: [round(float(np.percentile(a, 2.5)), 4), round(float(np.percentile(a, 97.5)), 4)]\n    resumen_ext = {\n        \"n\": int(len(y)),\n        \"f1_macro\": resumen,\n        \"ic95_f1\": {k: ic(v) for k, v in muestras.items()},\n        \"ic95_diferencia_beto_menos\": {k: ic(v) for k, v in difs.items()},\n        \"distribucion_etiquetas\": df[\"etiqueta\"].value_counts().to_dict(),\n        \"n_negocios\": int(df[\"negocio\"].nunique()), \"n_ciudades\": int(df[\"ciudad\"].nunique()),\n    }\n    (RESULTADOS / \"externo_resumen.json\").write_text(json.dumps(resumen_ext, indent=2, ensure_ascii=False), encoding=\"utf-8\")\n    print(\"F1 macro en Colombia:\", resumen)\n    print(\"IC95:\", resumen_ext[\"ic95_f1\"], \"diferencias:\", resumen_ext[\"ic95_diferencia_beto_menos\"])\n\n\nif __name__ == \"__main__\":\n    main()\n", "demo.py": "\"\"\"Demo en vivo: escribe una reseña y el BETO ajustado dice si es negativa, neutral o positiva.\n\nUso:\n    python src/demo.py              -> modo interactivo (escribe reseñas; Enter vacío o \"salir\" para terminar)\n    python src/demo.py --ejemplos   -> corre primero las frases preparadas para la sustentación\n    python src/demo.py \"texto\"      -> clasifica solo ese texto\n\nUsa el mejor checkpoint de BETO (resultados/beto_final.json -> metricas.json -> mejor_checkpoint).\nNo necesita internet: el modelo está guardado en modelos/_checkpoints/.\n\"\"\"\nimport json\nimport logging\nimport os\nimport sys\nimport time\n\nos.environ.setdefault(\"TRANSFORMERS_VERBOSITY\", \"error\")\nlogging.disable(logging.WARNING)  # oculta avisos técnicos de torch/transformers durante la demo\nimport torch  # noqa: E402\nfrom transformers import AutoModelForSequenceClassification, AutoTokenizer  # noqa: E402\nfrom transformers.utils import logging as hf_logging  # noqa: E402\n\nhf_logging.disable_progress_bar()\n\nfrom config import ETIQUETAS, RESULTADOS  # noqa: E402\n\n# Frases pensadas para mostrar aciertos claros, casos difíciles y una contradicción con las estrellas\nEJEMPLOS = [\n    \"La comida llegó fría, el mesero fue grosero y nos cobraron de más. No vuelvo.\",\n    \"Excelente atención, el corte quedó perfecto y el lugar es muy limpio. ¡Recomendadísimo!\",\n    \"Normal, nada del otro mundo. La comida estaba bien pero un poco cara para lo que es.\",\n    \"El café es bueno, aunque la atención fue algo lenta.\",\n    \"Qué maravilla esperar una hora para que te traigan el plato equivocado.\",  # sarcasmo\n    \"No estuvo mal.\",\n]\n\nCOLORES = {\"negativo\": \"\\033[91m\", \"neutral\": \"\\033[93m\", \"positivo\": \"\\033[92m\"}\nFIN = \"\\033[0m\"\n\n\ndef cargar():\n    final = json.loads((RESULTADOS / \"beto_final.json\").read_text(encoding=\"utf-8\"))\n    m = json.loads((RESULTADOS / final[\"corrida\"] / \"metricas.json\").read_text(encoding=\"utf-8\"))\n    ruta = m[\"mejor_checkpoint\"]\n    if not os.path.isdir(ruta):\n        raise SystemExit(f\"No encuentro el modelo en {ruta}. Hay que entrenarlo primero (src/entrenar_transformer.py).\")\n    print(f\"Cargando BETO ajustado ({final['corrida']}) ...\", flush=True)\n    t0 = time.time()\n    tok = AutoTokenizer.from_pretrained(ruta)\n    modelo = AutoModelForSequenceClassification.from_pretrained(ruta).eval()\n    disp = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    modelo.to(disp)\n    print(f\"Listo en {time.time() - t0:.1f} s (usando {disp.upper()}).\\n\")\n    return tok, modelo, disp, m[\"hiperparametros\"][\"max_len\"]\n\n\n@torch.no_grad()\ndef clasificar(texto, tok, modelo, disp, max_len):\n    x = tok(texto, truncation=True, max_length=max_len, return_tensors=\"pt\").to(disp)\n    probs = torch.softmax(modelo(**x).logits, dim=-1)[0].tolist()\n    return probs, len(x[\"input_ids\"][0])\n\n\ndef mostrar(texto, tok, modelo, disp, max_len):\n    t0 = time.time()\n    probs, n_tokens = clasificar(texto, tok, modelo, disp, max_len)\n    ms = (time.time() - t0) * 1000\n    gana = ETIQUETAS[max(range(3), key=lambda i: probs[i])]\n    print(f\"  Reseña: {texto}\")\n    print(f\"  -> {COLORES[gana]}{gana.upper()}{FIN}   ({n_tokens} tokens, {ms:.0f} ms)\")\n    for e, p in zip(ETIQUETAS, probs):\n        barra = \"█\" * round(p * 30)\n        print(f\"     {e:<9} {COLORES[e]}{barra:<30}{FIN} {p * 100:5.1f}%\")\n    print()\n\n\ndef main():\n    if hasattr(sys.stdout, \"reconfigure\"):\n        sys.stdout.reconfigure(encoding=\"utf-8\")\n        sys.stdin.reconfigure(encoding=\"utf-8\")\n    os.system(\"\")  # activa los colores ANSI en la consola de Windows\n    args = sys.argv[1:]\n    tok, modelo, disp, max_len = cargar()\n\n    textos = [a for a in args if a != \"--ejemplos\"]\n    if textos:\n        for t in textos:\n            mostrar(t, tok, modelo, disp, max_len)\n        return\n    if \"--ejemplos\" in args:\n        print(\"=== Frases preparadas ===\\n\")\n        for t in EJEMPLOS:\n            mostrar(t, tok, modelo, disp, max_len)\n\n    print(\"Escribe una reseña y pulsa Enter (Enter vacío o 'salir' para terminar).\\n\")\n    while True:\n        try:\n            t = input(\"> \").strip()\n        except (EOFError, KeyboardInterrupt):\n            break\n        if not t or t.lower() == \"salir\":\n            break\n        mostrar(t, tok, modelo, disp, max_len)\n\n\nif __name__ == \"__main__\":\n    main()\n", "correr_busqueda.sh": "#!/bin/bash\n# Búsqueda de hiperparámetros (validación) + baseline multilingüe\nset -e\ncd \"$(dirname \"$0\")/src\"\nPY=../.venv/Scripts/python\nexport PYTHONIOENCODING=utf-8 HF_HUB_DISABLE_SYMLINKS_WARNING=1\nfor LR in 3e-5 2e-5 5e-5; do\n  $PY entrenar_transformer.py --modelo beto --lr $LR --epocas 4 --max_len 128 > ../logs/beto_lr${LR}_len128.log 2>&1\n  echo \"LISTO beto lr=$LR\"\ndone\n$PY entrenar_transformer.py --modelo mdistilbert --lr 5e-5 --epocas 4 --max_len 128 > ../logs/mdistilbert.log 2>&1\necho \"LISTO mdistilbert\"\n"}}</script>
<script>
const D = JSON.parse(document.getElementById('datos').textContent);
const $ = (s, el=document) => el.querySelector(s);
const pct = x => x==null ? '—' : (x*100).toFixed(1).replace('.', ',') + '%';
const dec = x => x==null ? '—' : x.toFixed(3).replace('.', ',');
const miles = x => x==null ? '—' : x.toLocaleString('es-CO');
const COL = ['var(--neg)','var(--neu)','var(--pos)'];
const CLASES = ['negativo','neutral','positivo'];
const B = D.modelos.beto, M = D.modelos.mdistilbert, T = D.modelos.tfidf;
const EXT = B.externo_colombia;

/* -------- Secciones -------- */
const SECCIONES = [
  ['desde-cero','Empieza aquí'], ['resumen','Resumen'], ['datos','Datos'], ['arquitectura','Arquitectura'], ['capas','Etapas intermedias'],
  ['entrenamiento','Entrenamiento'], ['resultados','Resultados'], ['codigo','Código'], ['preguntas','Preguntas'], ['guion','Guion'], ['glosario','Glosario']
];

function vistaResumen(){ return `
<section class="vista">
  <div class="bloque">
    <span class="eyebrow">Proyecto final · Redes neuronales · David Quintero Gallego</span>
    <h1>Sentimiento en reseñas de negocios con BETO</h1>
    <p class="lead">Clasificador de tres clases (negativo, neutral, positivo) para reseñas en español, construido ajustando (<em>fine-tuning</em>) un Transformer preentrenado en español, y comparado contra un modelo clásico y un Transformer multilingüe más pequeño.</p>

    <div class="kpi"><span>Accuracy en prueba</span><b>${pct(B.test.accuracy)}</b><span>${miles(D.datos.tamanos.test)} reseñas nunca vistas</span></div>
    <div class="kpi"><span>Mejora sobre TF-IDF</span><b>+${((B.test.f1_macro-T.test.f1_macro)*100).toFixed(1).replace('.',',')} pts</b><span>F1 macro, mismo conjunto de prueba</span></div>
    <div class="kpi"><span>Reseñas de entrenamiento</span><b>${miles(D.datos.tamanos.train)}</b><span>de ${miles(D.datos.n_original)} en Rest-Mex 2025</span></div>
  </div>
  <div class="bloque">
    <h2>La idea en 30 segundos</h2>
    <p>Un negocio recibe cientos de reseñas. Las estrellas no siempre cuentan la historia completa, y muchas plataformas ni siquiera las tienen. Quise un modelo que lea el texto y diga si la opinión es negativa, neutral o positiva. En lugar de entrenar una red desde cero, partí de <b>BETO</b>, un BERT que ya leyó ~3.000 millones de palabras en español, y le enseñé esta tarea específica con ${miles(D.datos.tamanos.train)} reseñas de TripAdvisor México. Es la misma lógica que usar una VGG o ResNet preentrenada en ImageNet para clasificar imágenes propias: <b>transfer learning</b>.</p>
  </div>
  <div class="bloque">
    <h3>Flujo del proyecto</h3>
    <div class="pipeline">
      <div class="paso"><span class="eyebrow">Datos</span><b>Rest-Mex 2025</b><small>${miles(D.datos.n_original)} reseñas, 1–5 estrellas</small></div>
      <div class="paso"><span class="eyebrow">Preproceso</span><b>Limpieza y 3 clases</b><small>ftfy, duplicados, balanceo, 70/15/15</small></div>
      <div class="paso"><span class="eyebrow">Modelos</span><b>TF-IDF · mDistilBERT · BETO</b><small>mismo split para los tres</small></div>
      <div class="paso"><span class="eyebrow">Selección</span><b>Curvas de validación</b><small>lr y max_len por F1 macro</small></div>
      <div class="paso"><span class="eyebrow">Evaluación</span><b>Prueba + dominio</b><small>test balanceado, natural y Colombia</small></div>
    </div>
  </div>
  <div class="grid2">
    <div class="panel bloque"><h3>Objetivo general</h3><p>Clasificador de 3 clases con BETO que alcance F1 macro ≥ 0,70 en prueba, y cuantificar cuánto se degrada en reseñas reales de Google de negocios colombianos.</p></div>

/* -------- Arquitectura -------- */
const EJ = ['[CLS]','La','comida','estaba','deli','##cios','##a','pero','el','servicio','fue','lent','##ísimo','[SEP]'];
const ETAPAS = [
 {id:'texto', n:'0', t:'Texto crudo', f:'string', d:`<p>Entrada: título + reseña, sin minúsculas ni limpieza agresiva.</p><div class="forma-grande">"La comida estaba deliciosa pero el servicio fue lentísimo"</div>`},
 {id:'tok', n:'1', t:'Tokenizador WordPiece', f:'[B, T] enteros', d:`<p>Parte el texto en <b>subpalabras</b> de un vocabulario de <b>31.002</b> piezas aprendido sobre español. Las palabras raras se dividen (<code>##</code> = continuación), así nunca hay palabras “desconocidas”. Agrega <code>[CLS]</code> al inicio y <code>[SEP]</code> al final, trunca a ${B.hiperparametros.max_len} tokens y rellena con <code>[PAD]</code> hasta el largo del lote (padding dinámico). También produce la <b>máscara de atención</b> (1 = token real, 0 = relleno).</p><div class="fila-tokens">${EJ.map(t=>`<span class="tok">${t}</span>`).join('')}</div><div class="forma-grande">input_ids: [B, T] · attention_mask: [B, T]   (B = ${B.hiperparametros.batch}, T ≤ ${B.hiperparametros.max_len})</div><p style="color:var(--muted);font-size:.9rem">La segmentación mostrada es ilustrativa.</p>`},
 {id:'emb', n:'2', t:'Embeddings', f:'[B, T, 768]', d:`<p>Cada id se convierte en un vector de 768 números. Se <b>suman</b> tres embeddings aprendidos y luego LayerNorm + dropout:</p><ul class="limpia"><li><b>Token</b>: tabla 31.002 × 768 (≈ 23,8 M parámetros).</li><li><b>Posición</b>: tabla 512 × 768. Sin esto el Transformer no sabría el orden (la atención es invariante al orden).</li><li><b>Segmento</b> (token type): 2 × 768, distingue frase A/B; aquí todo es segmento 0.</li></ul><div class="forma-grande">x = E_tok[id] + E_pos[i] + E_seg[s]  →  LayerNorm  →  Dropout(0,1)</div>`},
 {id:'enc', n:'3', t:'12 bloques encoder', f:'[B, T, 768] → igual', x12:true, d:`<p>Doce bloques idénticos apilados (≈ 85 M parámetros en total, 7,1 M cada uno). Cada bloque:</p><ol class="limpia"><li><b>Self-attention multi-cabeza</b> (12 cabezas × 64 dim): cada token mira a todos los demás y decide cuánto le importa cada uno.<div class="formula">Atención(Q,K,V) = softmax(Q·Kᵀ / √64 + máscara) · V</div></li><li><b>Conexión residual + LayerNorm</b>: x + Atención(x). Facilita el paso del gradiente en redes profundas.</li><li><b>Feed-forward</b> por token: 768 → 3072 → 768 con activación <b>GELU</b>.</li><li><b>Residual + LayerNorm</b> otra vez. Dropout 0,1 en ambas subcapas.</li></ol><p>La forma del tensor no cambia: entra [B, T, 768] y sale [B, T, 768], pero el contenido se vuelve cada vez más contextual. En la pestaña <a href="#capas">Etapas intermedias</a> se ve cómo aparece la separación de clases capa por capa.</p>`},
 {id:'cls', n:'4', t:'Vector [CLS]', f:'[B, 768]', d:`<p>Se toma solo la salida de la posición 0, el token <code>[CLS]</code>. Como la atención deja que este token mire toda la frase, su vector final funciona como un <b>resumen de la reseña</b>. En el preentrenamiento original se usó para la tarea de “siguiente oración”, por eso está entrenado para agregar información de la secuencia.</p><div class="forma-grande">h_cls = H[:, 0, :]   →   [B, 768]</div>`},
 {id:'pool', n:'5', t:'Pooler', f:'[B, 768]', d:`<p>Capa densa 768 → 768 con activación <b>tanh</b> (≈ 0,59 M parámetros), viene preentrenada con BETO. Luego <b>dropout 0,1</b> como regularización.</p><div class="forma-grande">p = tanh(W·h_cls + b)  →  Dropout(0,1)</div>`},
 {id:'head', n:'6', t:'Cabeza de clasificación', f:'[B, 3]', d:`<p>Única capa <b>nueva</b>, inicializada al azar: lineal 768 → 3 (2.307 parámetros). Produce un <i>logit</i> por clase.</p><div class="forma-grande">z = W·p + b   →   [z_neg, z_neu, z_pos]</div>`},
 {id:'soft', n:'7', t:'Softmax + pérdida', f:'[B, 3] probabilidades', d:`<p><b>Softmax</b> convierte los logits en probabilidades que suman 1; la predicción es la clase con mayor probabilidad. En entrenamiento se usa <b>entropía cruzada</b> contra la etiqueta verdadera, y el gradiente fluye hacia atrás por <i>todas</i> las capas (fine-tuning completo, nada congelado).</p><div class="formula">p_k = e^{z_k} / Σ_j e^{z_j}        L = −log p_{y}</div>`},
];

<section class="vista">

/* -------- Capas -------- */
function graficoSondas(){
  const C = D.capas; if(!C) return '<p>Sin datos.</p>';
  const W=640,H=300,ml=46,mr=16,mt=16,mb=52, n=C.capas.length;
  const vals=[...C.sonda_f1_preentrenado,...C.sonda_f1_finetuned];
  const y0=Math.floor(Math.min(...vals)*10)/10, y1=1;
  const X=i=>ml+i*(W-ml-mr)/(n-1), Y=v=>mt+(y1-v)*(H-mt-mb)/(y1-y0);
  let g='';
  for(let v=y0; v<=y1+1e-9; v+=0.1){ g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(1).replace('.',',')}</text>`; }
  C.capas.forEach((c,i)=>{ g+=`<text x="${X(i)}" y="${H-mb+18}" text-anchor="middle">${i===0?'emb':i}</text>`; });
  g+=`<text x="${(ml+W-mr)/2}" y="${H-8}" text-anchor="middle">capa del encoder (0 = embeddings)</text>`;
  const linea=(arr,col,dash)=>`<polyline fill="none" stroke="${col}" stroke-width="2.5" ${dash?'stroke-dasharray="6 5"':''} points="${arr.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+arr.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${col}"><title>Capa ${i}: F1 ${dec(v)}</title></circle>`).join('');
  g+=linea(C.sonda_f1_preentrenado,'var(--muted)',true)+linea(C.sonda_f1_finetuned,'var(--accent)',false);
  const last=C.sonda_f1_finetuned.length-1;
  g+=`<text x="${X(last)-6}" y="${Y(C.sonda_f1_finetuned[last])-10}" text-anchor="end" style="fill:var(--accent);font-weight:600">${dec(C.sonda_f1_finetuned[last])}</text>`;
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="F1 de la sonda lineal por capa">${g}</svg>
  <div class="leyenda"><span><i style="background:var(--accent)"></i>BETO ajustado (fine-tuned)</span><span><i style="background:var(--muted)"></i>BETO de fábrica (sin ajustar)</span></div>`;
}
function graficoPCA(capa, cual){
  const pts = D.capas[cual==='ft'?'pca_finetuned':'pca_preentrenado'][capa]; const S=300,m=12;
  const P=v=>m+(v+1)/2*(S-2*m);
  return `<svg class="grafico" viewBox="0 0 ${S} ${S}" role="img" aria-label="Proyección PCA del vector CLS en la capa ${capa}" style="max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px">${pts.map(([a,b,c])=>`<circle cx="${P(a).toFixed(1)}" cy="${P(-b).toFixed(1)}" r="3" fill="${COL[c]}" fill-opacity=".7"/>`).join('')}</svg>`;
}
function vistaCapas(){
  const C = D.capas;
  return `
<section class="vista">
  <div class="bloque"><span class="eyebrow">Lo que el profe quiere ver</span><h2>Etapas intermedias: qué pasa dentro de las 12 capas</h2>
  <p class="lead">Extraje el vector <code>[CLS]</code> a la salida de cada una de las 13 etapas (embeddings + 12 encoders) para ${miles(C?C.n_muestras:2100)} reseñas de prueba, y medí qué tan separables son las clases en cada etapa con una <b>sonda lineal</b>: una regresión logística entrenada encima de ese vector congelado.</p></div>
  <div class="panel bloque"><h3>F1 macro de la sonda lineal por capa</h3>${graficoSondas()}
  <ul class="limpia" style="color:var(--muted)">
   <li><b>Etapa 0 (embeddings) = ${dec(C?C.sonda_f1_finetuned[0]:null)}, azar puro.</b> Antes de la atención, el vector de <code>[CLS]</code> es el mismo para todas las reseñas (mismo token, misma posición 0): todavía no ha “leído” nada. Desde la capa 1 ya depende del texto, porque la atención le trae información de las demás palabras.</li>
   <li><b>Sin ajustar</b>, BETO ya codifica algo de sentimiento (sonda de la mejor capa ≈ ${dec(C?Math.max(...C.sonda_f1_preentrenado):null)}): el preentrenamiento aprendió rasgos útiles, igual que las capas intermedias de una VGG preentrenada ya detectan bordes y texturas.</li>
   <li><b>Ajustado</b>, la separabilidad sube sobre todo en las capas altas: el fine-tuning reescribe principalmente las capas finales para la tarea, mientras las primeras (sintaxis, morfología) cambian poco.</li>
   <li>En el modelo de fábrica la última capa no es la mejor: está especializada en su tarea de preentrenamiento (predecir palabras ocultas), no en sentimiento.</li>
   <li>La sonda queda por debajo del modelo completo (${dec(B.test.f1_macro)}) porque se entrena con solo ${miles(Math.round((C?C.n_muestras:2100)*0.7))} reseñas y usa el [CLS] crudo, sin el pooler ni la cabeza.</li></ul></div>
  <div class="panel bloque"><h3>Cómo se separan las clases (PCA 2D del [CLS])</h3>
   <div class="control" id="ctrl-pca">${Object.keys(C?C.pca_finetuned:{}).map((k,i)=>`<button data-capa="${k}" aria-pressed="${k==='12'}">${k==='0'?'Embeddings':'Capa '+k}</button>`).join('')}
   <span style="flex:1"></span><button data-modo="ft" aria-pressed="true">Ajustado</button><button data-modo="pre" aria-pressed="false">De fábrica</button></div>
   <div id="pca"></div>
   <div class="leyenda"><span><i style="background:var(--neg)"></i>negativo</span><span><i style="background:var(--neu)"></i>neutral</span><span><i style="background:var(--pos)"></i>positivo</span></div>
   <p style="color:var(--muted)">Cada punto es una reseña proyectada de 768 a 2 dimensiones. En la capa 12 del modelo ajustado se forman tres grupos con el neutral en medio; esa es la geometría que la capa lineal final separa con dos rectas.</p></div>
  <div class="panel bloque"><h3>A qué palabras mira el [CLS] (última capa)</h3>
   <div class="control" id="ctrl-att">${(C?C.atencion:[]).map((a,i)=>`<button data-i="${i}" aria-pressed="${i===0}">Ejemplo ${i+1}</button>`).join('')}</div>
   <div id="att" class="fila-tokens" style="gap:6px"></div>
   <p style="color:var(--muted);font-size:.9rem">Intensidad = peso de atención del token [CLS] hacia cada token, promedio de las 12 cabezas de la capa 12 (la escala de color excluye [CLS] y [SEP]). Detalle curioso: [SEP] se lleva cerca del ${pct(C?C.atencion[0].pesos[C.atencion[0].pesos.length-1]:null)} de la atención. Es un fenómeno conocido en BERT (Clark et al., 2019): las cabezas usan [SEP] como “no-op” cuando no tienen nada útil que mirar. Por eso la atención es una pista de interpretabilidad, no una explicación causal completa.</p></div>

/* -------- Entrenamiento -------- */
function curvas(hist){
  const tr=hist.filter(h=>h.loss!=null&&h.epoch!=null), ev=hist.filter(h=>h.eval_loss!=null);
  const W=640,H=280,ml=44,mr=44,mt=14,mb=40;
  const maxE=Math.max(...hist.map(h=>h.epoch||0));
  const maxL=Math.max(...tr.map(h=>h.loss),...ev.map(h=>h.eval_loss))*1.05;
  const X=e=>ml+e/maxE*(W-ml-mr), YL=l=>mt+(1-l/maxL)*(H-mt-mb), YF=f=>mt+(1-(f-0.4)/0.6)*(H-mt-mb);
  let g='';
  for(let i=0;i<=4;i++){const l=maxL*i/4; g+=`<line x1="${ml}" x2="${W-mr}" y1="${YL(l)}" y2="${YL(l)}" stroke="var(--line)"/><text x="${ml-6}" y="${YL(l)+4}" text-anchor="end">${l.toFixed(2).replace('.',',')}</text>`;}
  for(let f=0.4;f<=1.0001;f+=0.2){g+=`<text x="${W-mr+6}" y="${YF(f)+4}" style="fill:var(--accent)">${f.toFixed(1).replace('.',',')}</text>`;}
  for(let e=0;e<=Math.ceil(maxE);e++){g+=`<text x="${X(e)}" y="${H-mb+16}" text-anchor="middle">${e}</text>`;}
  g+=`<text x="${(ml+W-mr)/2}" y="${H-6}" text-anchor="middle">época</text>`;
  g+=`<polyline fill="none" stroke="var(--muted)" stroke-width="1.6" points="${tr.map(h=>X(h.epoch)+','+YL(h.loss)).join(' ')}"/>`;
  g+=`<polyline fill="none" stroke="var(--neg)" stroke-width="2.4" points="${ev.map(h=>X(h.epoch)+','+YL(h.eval_loss)).join(' ')}"/>`;
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="${ev.map(h=>X(h.epoch)+','+YF(h.eval_f1_macro)).join(' ')}"/>`;
  const best=ev.reduce((a,b)=>b.eval_f1_macro>a.eval_f1_macro?b:a);
  g+=`<circle cx="${X(best.epoch)}" cy="${YF(best.eval_f1_macro)}" r="5" fill="var(--accent)"><title>Mejor F1 val ${dec(best.eval_f1_macro)}</title></circle>`;
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curvas de entrenamiento">${g}</svg>
  <div class="leyenda"><span><i style="background:var(--muted)"></i>pérdida entrenamiento</span><span><i style="background:var(--neg)"></i>pérdida validación</span><span><i style="background:var(--accent)"></i>F1 macro validación (eje derecho)</span><span>● mejor checkpoint (F1 ${dec(best.eval_f1_macro)}, época ${best.epoch.toFixed(2).replace('.',',')})</span></div>`;
}

  return `
<section class="vista">

    <div class="kpi"><span>Tiempo</span><b>${Math.round(B.segundos_entrenamiento/60)} min</b><span>fp16 (precisión mixta)</span></div>
  </div>
  <div class="panel bloque"><h3>Curvas del modelo final</h3>${curvas(D.historial_beto)}
   <p style="color:var(--muted)">La pérdida de entrenamiento sigue bajando, pero la de validación toca fondo y luego sube: ahí empieza el sobreajuste. Por eso evaluamos cada 200 pasos y nos quedamos con el checkpoint de mejor F1 de validación (<code>load_best_model_at_end</code>), no con el último.</p></div>
  <div class="bloque"><h3>Búsqueda de hiperparámetros (validación)</h3>
  <div class="tabla"><table><tr><th>Corrida</th><th>lr</th><th>max_len</th><th>F1 val</th><th>Minutos</th></tr>
  ${busq.map(r=>`<tr class="${r.elegida?'destacada':''}"><td>${r.nombre}${r.elegida?' <span class="pill ok">elegida</span>':''}</td><td class="num">${r.lr}</td><td class="num">${r.max_len}</td><td class="num">${dec(r.f1_val)}</td><td class="num">${Math.round(r.seg/60)}</td></tr>`).join('')}
  </table></div>
  <p style="color:var(--muted)">La decisión se toma solo con validación; el test se mira una vez al final.</p></div>
  <div class="grid2">
   <div class="panel bloque"><h3>Configuración y por qué</h3><ul class="limpia">
    <li><b>AdamW</b>, weight decay 0,01: Adam con regularización L2 desacoplada; estándar para Transformers.</li>
    <li><b>Warmup 10%</b>: el lr sube de 0 al valor objetivo y luego baja linealmente; evita que la cabeza aleatoria envíe gradientes enormes al inicio.</li>
    <li><b>Entropía cruzada</b> como pérdida; <b>dropout 0,1</b> en todo el modelo.</li>
    <li><b>Padding dinámico</b> por lote (<code>DataCollatorWithPadding</code>) y <b>fp16</b>: ~2× más rápido y menos memoria.</li>
    <li><b>Semilla 42</b> en datos, inicialización y orden de lotes: reproducible.</li></ul></div>
   <div class="panel bloque"><h3>Baselines</h3><ul class="limpia">
    <li><b>TF-IDF + Regresión logística</b>: bolsa de uni y bigramas (${miles(200000)} términos máx.), C = 4. Entrena en segundos en CPU. Responde: ¿vale la pena una red de 110 M parámetros?</li>
    <li><b>DistilBERT multilingüe</b>: mismo pipeline y Trainer, lr ${M.hiperparametros.lr}. Responde: ¿importa que el modelo esté preentrenado específicamente en español?</li></ul></div>
  </div>
</section>`;}

/* -------- Resultados -------- */
function matriz(cm, titulo){
  const tot=cm.map(r=>r.reduce((a,b)=>a+b,0));
  let h=`<div class="matriz"><div class="h"></div>${CLASES.map(c=>`<div class="h">pred. ${c.slice(0,3)}</div>`).join('')}`;
  cm.forEach((r,i)=>{ h+=`<div class="h" style="text-align:right">real ${CLASES[i].slice(0,3)}</div>`+r.map((v,j)=>{const p=v/tot[i]; return `<div style="background:color-mix(in srgb,${i===j?'var(--accent)':'var(--neg)'} ${Math.round(p*85)}%,var(--surface-2));color:${p>.5?'var(--surface)':'var(--fg)'}" title="${miles(v)} reseñas">${pct(p)}</div>`}).join(''); });
  return `<div class="bloque"><h3>${titulo}</h3>${h}</div><p style="color:var(--muted);font-size:.86rem">Porcentaje por fila (recall). Diagonal = aciertos.</p>`;
}
function filaModelo(nombre, m, conj, destacada){
  const r=m[conj]; if(!r) return `<tr><td>${nombre}</td><td colspan="5" style="color:var(--muted)">pendiente</td></tr>`;
  return `<tr class="${destacada?'destacada':''}"><td>${nombre}</td><td class="num">${pct(r.accuracy)}</td><td class="num"><b>${dec(r.f1_macro)}</b></td>${CLASES.map(c=>`<td class="num">${dec(r.por_clase[c].recall)}</td>`).join('')}</tr>`;
}
function tablaConj(conj, titulo){
  return `<div class="bloque"><h3>${titulo}</h3><div class="tabla"><table><tr><th>Modelo</th><th>Accuracy</th><th>F1 macro</th><th>Recall neg</th><th>Recall neu</th><th>Recall pos</th></tr>
  ${filaModelo('TF-IDF + RL',T,conj)}${filaModelo('DistilBERT multilingüe',M,conj)}${filaModelo('BETO',B,conj,true)}</table></div></div>`;
}
function bloqueColombia(){

  const porTipo=Object.entries(EXT.por_tipo_negocio||{}).filter(([k,v])=>v.n>=4).sort((a,b)=>b[1].n-a[1].n);
  const cm=EXT.matriz_confusion, errNeu=cm[0][1]+cm[2][1], errTot=cm.flat().reduce((a,b)=>a+b,0)-cm[0][0]-cm[1][1]-cm[2][2];
  return `
  <div class="bloque" id="colombia"><span class="eyebrow">Objetivo 3 · cambio de dominio</span><h2>Prueba en Colombia: Google Maps</h2>
  <p class="lead">${X.n} reseñas públicas de ${X.n_negocios} negocios en ${X.n_ciudades} ciudades (restaurantes, cafés, panaderías, barberías, peluquería, gimnasio, veterinaria, lavandería, taller, heladería, tienda de ropa), recolectadas el 16 de noviembre de 2026, sin nombres de autor. Etiquetas: ${dist.negativo} negativas, ${dist.neutral} neutrales, ${dist.positivo} positivas, asignadas leyendo el texto.</p></div>
  ${tablaConj('externo_colombia','Resultados en Colombia ('+X.n+' reseñas)')}
  <div class="tabla"><table><tr><th>Modelo</th><th>F1 macro</th><th>Intervalo 95% (bootstrap)</th></tr>
   <tr><td>TF-IDF + RL</td><td class="num">${dec(X.f1_macro.tfidf)}</td><td class="num">${dec(ic.tfidf[0])} – ${dec(ic.tfidf[1])}</td></tr>
   <tr><td>DistilBERT multilingüe</td><td class="num">${dec(X.f1_macro.mdistilbert)}</td><td class="num">${dec(ic.mdistilbert[0])} – ${dec(ic.mdistilbert[1])}</td></tr>
   <tr class="destacada"><td>BETO</td><td class="num">${dec(X.f1_macro.beto)}</td><td class="num">${dec(ic.beto[0])} – ${dec(ic.beto[1])}</td></tr></table></div>
  <div class="simple"><b class="et">En palabras simples</b><p>Con solo ${X.n} reseñas, el resultado tiene un margen de error grande (como una encuesta con pocas personas). Los tres intervalos se solapan, así que en Colombia <b>no podemos afirmar que un modelo sea mejor que otro</b>. La diferencia BETO − DistilBERT está entre ${dec(di.mdistilbert[0])} y ${dec(di.mdistilbert[1])}: incluye el cero.</p></div>
  <div class="bloque"><h3>Lo que encontramos</h3><ul class="limpia">
   <li><b>No hubo degradación; al contrario.</b> BETO obtuvo ${dec(EXT.f1_macro)} en Colombia contra ${dec(B.test.f1_macro)} en México. Hay tres razones, y conviene decirlas todas: (1) las etiquetas colombianas son <b>manuales</b>, sin el ruido de las estrellas (en México hay reseñas de 1 estrella con texto elogioso); (2) para conseguir negativas tomamos las reseñas de calificación más baja, que suelen ser quejas muy claras; (3) hay pocas neutrales (${dist.neutral}), la clase más difícil.</li>
   <li><b>Todos los errores de BETO son “hacia el centro”</b>: ${errNeu} de ${errTot} errores consistieron en llamar “neutral” a algo negativo o positivo. Nunca confundió negativo con positivo. Pasa sobre todo con reseñas <b>cortas y tibias</b> (“Lo mejor son los buñuelos”, “Un gimnasio diferente…”). Como lo entrenamos con un tercio de neutrales, tiende a usar esa clase cuando el texto da poca evidencia.</li>
   <li><b>BETO lee el texto, no las estrellas.</b> El ${pct(EXT.acuerdo_manual_vs_estrellas)} de las etiquetas manuales coincide con la regla de estrellas. En las ${X.n - Math.round(EXT.acuerdo_manual_vs_estrellas*X.n)} reseñas donde el texto contradice a las estrellas, BETO acertó según el texto en 12. Ejemplo: una reseña de <b>1 estrella</b> que dice “La comida deliciosa y el servicio al cliente excelente” la clasificó como positiva.</li>
   <li><b>El léxico colombiano no lo rompió</b>: “estos manes son unos tesos”, “chévere” o “parquear” aparecen en reseñas bien clasificadas, porque el contexto alrededor sigue siendo claro.</li></ul></div>
  ${porTipo.length?`<div class="bloque"><h3>Accuracy de BETO por tipo de negocio</h3><div class="tabla"><table><tr><th>Tipo</th><th>Reseñas</th><th>Accuracy</th></tr>${porTipo.map(([k,v])=>`<tr><td>${k}</td><td class="num">${v.n}</td><td class="num">${pct(v.accuracy)}</td></tr>`).join('')}</table></div><p style="color:var(--muted);font-size:.9rem">Con tan pocas reseñas por tipo son indicios, no conclusiones. Las barberías, la veterinaria y la lavandería nunca aparecieron en el entrenamiento (solo hoteles, restaurantes y atractivos) y aun así se clasificaron bien.</p></div>`:''}
  ${X.errores_beto&&X.errores_beto.length?`<div class="bloque"><h3>Errores de BETO en Colombia</h3><div class="tabla"><table><tr><th>Reseña</th><th>Estrellas</th><th>Etiqueta</th><th>BETO</th></tr>${X.errores_beto.map(e=>`<tr><td style="white-space:normal;min-width:260px">${e.texto.length>220?e.texto.slice(0,220)+'…':e.texto}</td><td class="num">${e.estrellas}</td><td class="c-${e.real.slice(0,3)}">${e.real}</td><td class="c-${e.pred.slice(0,3)}">${e.pred}</td></tr>`).join('')}</table></div></div>`:''}
  <div class="aviso"><b>Cómo se etiquetó, dicho con honestidad.</b> Las reseñas las recolectamos con el navegador desde Google Maps. La etiqueta de cada una se propuso leyendo el texto con reglas fijas (predomina la queja → negativo; mezcla equilibrada o sin valoración clara → neutral; predomina el elogio → positivo) y la revisé yo. El archivo está en <code>data/externo/resenas_google_colombia.csv</code>. Como lo etiquetó una sola persona, las neutrales son las más discutibles.</div>`;
}

   <li><b>Neutral es la clase difícil</b> (recall ${dec(B.test.por_clase.neutral.recall)}): una reseña de 3 estrellas mezcla elogios y quejas, y la frontera con 2 o 4 estrellas es subjetiva incluso para personas.</li>
   <li>Casi no hay confusión directa entre negativo y positivo (${pct(B.test.matriz_confusion[0][2]/B.test.matriz_confusion[0].reduce((a,b)=>a+b,0))} de negativos predichos como positivos): los errores son “de vecindad”.</li>
