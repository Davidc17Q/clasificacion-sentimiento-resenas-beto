const PREG = [
 ['arq','¿Qué arquitectura usaron y por qué esa?',`Un <b>Transformer encoder</b>: BETO, que es un BERT-base (12 capas, 768 dimensiones, 12 cabezas de atención, ${(B.parametros_entrenables/1e6).toFixed(0)} M parámetros) preentrenado solo en español. Lo escogí porque (1) la atención captura relaciones entre palabras lejanas, como “pero” que invierte el sentido de toda la frase; (2) viene preentrenado, así que con ~21 mil reseñas basta para ajustarlo; (3) al ser monolingüe, su vocabulario está hecho para el español y parte menos las palabras.`, 'Cierra con el número: F1 macro de '+dec(B.test.f1_macro)+' contra '+dec(T.test.f1_macro)+' del baseline.'],
 ['arq','¿Usaron VGG, ResNet u otra CNN? ¿Por qué no?',`No. VGG y ResNet son redes convolucionales diseñadas para <b>imágenes</b>: filtros 3×3 que explotan que los píxeles vecinos están relacionados. Nuestro dato es <b>texto</b>, una secuencia de tokens donde lo importante puede estar lejos (“la comida estaba buena… pero nunca volvería”). Lo que sí tomé de esa idea es el <b>transfer learning</b>: así como en visión se toma una VGG preentrenada en ImageNet y se le cambia la última capa, aquí tomé BETO preentrenado en millones de textos y le puse una capa de 768 → 3.`, 'Analogía clave: BETO es al texto en español lo que VGG preentrenada en ImageNet es a las imágenes.'],
 ['arq','¿Cuáles son las etapas intermedias del modelo?',`Ocho pasos: <b>(1)</b> tokenización WordPiece a ids; <b>(2)</b> embeddings de token + posición + segmento, [B,T,768]; <b>(3)</b> 12 bloques encoder, cada uno con self-attention multi-cabeza, residual + LayerNorm, feed-forward 768→3072→768 con GELU y otra residual + LayerNorm; <b>(4)</b> se toma el vector del token [CLS], [B,768]; <b>(5)</b> pooler denso + tanh; <b>(6)</b> dropout; <b>(7)</b> lineal 768→3, logits; <b>(8)</b> softmax y entropía cruzada.`, 'Abre la pestaña Arquitectura y recórrela con el dedo mientras hablas.'],
 ['arq','¿Qué aprende cada etapa intermedia? ¿Lo pueden mostrar?',`Sí. Extraje el [CLS] de las 13 salidas internas y entrené una sonda lineal en cada una. En la etapa de embeddings el [CLS] es idéntico para todas las reseñas (F1 de azar, ${dec(D.capas?D.capas.sonda_f1_finetuned[0]:null)}); desde la capa 1 la atención le mete información del texto, y en el modelo ajustado la separabilidad crece con la profundidad hasta F1 ≈ ${dec(D.capas?Math.max(...D.capas.sonda_f1_finetuned):null)} en las capas finales. En el BETO de fábrica ya hay señal de sentimiento (≈ ${dec(D.capas?Math.max(...D.capas.sonda_f1_preentrenado):null)} en su mejor capa), lo que demuestra que el preentrenamiento aporta. La literatura (Tenney et al., 2019; Jawahar et al., 2019) muestra que las capas bajas codifican morfología y superficie, las medias sintaxis y las altas semántica.`, 'Muestra la gráfica de sondas y el PCA de la capa 0 vs la 12.'],
 ['arq','¿Cómo funciona la auto-atención?',`Cada token genera tres vectores con matrices aprendidas: <b>Query</b> (qué busco), <b>Key</b> (qué ofrezco) y <b>Value</b> (qué contenido aporto). El peso que el token i da al token j es softmax(Q_i·K_j / √d_k), y la salida es el promedio ponderado de los Values. Se hace en 12 cabezas de 64 dimensiones en paralelo para que cada una se especialice en un tipo de relación, y se concatenan.`, 'Fórmula: softmax(QKᵀ/√d_k)·V.'],
 ['arq','¿Por qué se divide por √d_k?',`Porque el producto punto de vectores de 64 dimensiones crece con la dimensión; valores grandes saturan la softmax (casi one-hot) y los gradientes se vuelven casi cero. Dividir por √64 = 8 mantiene la varianza cerca de 1.`, ''],
 ['arq','¿Qué es el token [CLS] y por qué usar solo ese?',`Es un token especial al inicio de cada secuencia. No representa ninguna palabra, así que su vector final solo contiene lo que recogió atendiendo a toda la frase: funciona como resumen. BERT se preentrenó usándolo para clasificar pares de oraciones, por eso es el punto natural para colgar el clasificador. Alternativa: promediar todos los tokens (mean pooling); el resultado suele ser parecido.`, ''],
 ['arq','¿Qué son las conexiones residuales y LayerNorm?',`La residual suma la entrada a la salida de la subcapa (x + f(x)), así el gradiente tiene un camino directo hacia atrás y se pueden apilar 12 bloques sin desvanecimiento; es la misma idea que hizo funcionar a ResNet. LayerNorm normaliza cada vector a media 0 y varianza 1 (con escala y sesgo aprendidos), estabilizando el entrenamiento.`, 'Puente con visión: “la residual es la idea de ResNet aplicada al Transformer”.'],
 ['arq','¿Cómo sabe el modelo el orden de las palabras?',`La atención por sí sola no ve el orden: trata la frase como un conjunto. BERT suma un <b>embedding de posición aprendido</b> (una tabla de 512 posiciones × 768) al embedding de cada token. Por eso el máximo de BERT son 512 tokens.`, ''],
 ['arq','¿Qué activación usa y por qué?',`GELU en el feed-forward (una versión suave de ReLU que pondera la entrada por la probabilidad de una normal: x·Φ(x)), tanh en el pooler y softmax a la salida para obtener probabilidades. GELU es la elección original de BERT y da gradientes no nulos para valores negativos pequeños.`, ''],
 ['arq','¿Por qué un Transformer y no una LSTM o una RNN?',`La LSTM procesa palabra por palabra: es secuencial (lenta en GPU) y la información de palabras lejanas se diluye. El Transformer mira todas las posiciones a la vez, en paralelo, con caminos de longitud 1 entre cualquier par de palabras. Y lo decisivo: existen Transformers preentrenados en español, mientras que una LSTM habría que entrenarla desde cero con solo 21 mil ejemplos.`, ''],
 ['arq','¿Por qué BETO y no BERT multilingüe, XLM-R o un LLM como GPT?',`Comparé contra DistilBERT multilingüe y BETO ganó por ${((B.test.f1_macro-M.test.f1_macro)*100).toFixed(1).replace('.',',')} puntos. Un vocabulario solo en español representa mejor las palabras (menos fragmentación) y todo su preentrenamiento es en español. XLM-R-base o RoBERTa-BNE serían alternativas razonables. Un LLM generativo es muchísimo más grande y costoso para una tarea de clasificación cerrada; un encoder ajustado es más barato, más rápido y más fácil de evaluar.`, ''],
 ['arq','¿Qué es WordPiece y qué pasa con palabras que no conoce?',`Es un tokenizador por subpalabras: el vocabulario (31.002 piezas en BETO) contiene palabras frecuentes completas y fragmentos. Una palabra rara se divide en piezas conocidas (“lentísimo” → “lent” + “##ísimo”). Así no hay palabras fuera de vocabulario y el modelo aprovecha la morfología.`, ''],
 ['arq','¿Qué significa “cased” y “Whole Word Masking”?',`<b>Cased</b>: distingue mayúsculas y minúsculas y conserva tildes (“PÉSIMO” lleva información). <b>Whole Word Masking</b> es cómo se preentrenó: se ocultan palabras completas (todas sus subpalabras) y el modelo debe adivinarlas por contexto (Masked Language Modeling). Ese ejercicio es lo que le enseña el idioma.`, ''],
 ['ent','¿Qué es fine-tuning? ¿Congelaron capas?',`Fine-tuning es continuar el entrenamiento de un modelo preentrenado en nuestra tarea. Agregué la capa 768→3 aleatoria y actualicé <b>todos</b> los pesos (no congelé nada) con un learning rate pequeño. La alternativa, “feature extraction”, congela BETO y entrena solo la cabeza; la sonda lineal sobre el BETO de fábrica es justamente eso y da ≈ ${dec(D.capas?Math.max(...D.capas.sonda_f1_preentrenado):null)}, bastante menos que ajustar todo.`, 'Este contraste (congelado vs ajustado) es un argumento fuerte; tenlo a mano.'],
 ['ent','¿Por qué un learning rate tan pequeño?',`Con ${B.hiperparametros.lr} los pesos preentrenados cambian poco. Con valores grandes (1e-3, típico al entrenar desde cero) se destruye lo aprendido (<i>catastrophic forgetting</i>) y el entrenamiento diverge. Probé ${[...new Set(D.busqueda.map(r=>r.lr))].join(', ')} y elegí por F1 de validación.`, ''],
 ['ent','¿Cómo eligieron los hiperparámetros?',`Con el conjunto de validación: evalué cada 200 pasos, miré la curva de pérdida y de F1, comparé learning rates y longitudes máximas, y me quedé con la mejor combinación. El test no se usó para decidir nada.`, 'Muestra la tabla de búsqueda en la pestaña Entrenamiento.'],
 ['ent','¿Qué optimizador y qué función de pérdida?',`AdamW (Adam con weight decay desacoplado, 0,01), warmup lineal del 10% y decaimiento lineal del lr hasta 0. Pérdida: entropía cruzada entre la softmax de 3 clases y la etiqueta.`, ''],
 ['ent','¿Qué es el warmup y para qué sirve?',`Durante el primer 10% de pasos el learning rate sube de 0 al valor objetivo. Al inicio la cabeza es aleatoria y produce gradientes grandes y ruidosos; si el lr ya estuviera alto, esos gradientes dañarían las capas preentrenadas. Además los momentos de Adam aún no están bien estimados.`, ''],
 ['ent','¿Hubo sobreajuste? ¿Cómo lo controlaron?',`Sí aparece: la pérdida de entrenamiento sigue bajando mientras la de validación sube después de cierto punto. Lo controlé con (1) evaluación periódica y quedarme con el mejor checkpoint de validación, (2) early stopping, (3) dropout 0,1 y weight decay, (4) pocas épocas, que es lo normal en fine-tuning.`, 'Señala en la curva el punto donde la pérdida de validación toca fondo.'],
 ['ent','¿Por qué max_len = '+B.hiperparametros.max_len+'?',`La mediana es de ~${Math.round(D.datos.longitud_caracteres['50%']/4.3)} tokens; con ${B.hiperparametros.max_len} se trunca el ${pct(B.fraccion_truncada_train)} de las reseñas. Con 128 se truncaba el 25%: el final de muchas reseñas (donde suele estar el “pero…” o la conclusión) se perdía. Con 256 sube el F1 de validación y el entrenamiento tarda ~40% más; como la atención cuesta O(T²), duplicar la longitud cuadruplica el costo de esa parte. No usé 512 porque casi nada se trunca ya y el costo se dispararía.`, 'Si pregunta por la comparación justa: DistilBERT se entrenó con 128; la diferencia contra BETO-128 (misma longitud) es casi la misma.'],
 ['ent','¿Cuánto tardó y en qué hardware?',`Una ${B.gpu} de portátil (8 GB). BETO final: ${Math.round(B.segundos_entrenamiento/60)} min con precisión mixta fp16. TF-IDF: ${T.segundos_entrenamiento} s en CPU.`, ''],
 ['ent','¿Qué es fp16 / precisión mixta?',`Los cálculos pesados se hacen en coma flotante de 16 bits (más rápido en tensor cores y la mitad de memoria) mientras una copia maestra de los pesos se mantiene en 32 bits. Un escalado de la pérdida evita que gradientes pequeños se vuelvan cero.`, ''],
 ['ent','¿Cómo aseguran reproducibilidad?',`Semilla 42 fija en el muestreo, la división, la inicialización de la cabeza y el orden de los lotes; versiones de librerías en <code>requirements.txt</code>; todo el pipeline son scripts que se corren en orden.`, ''],
 ['dat','¿De dónde salen los datos? ¿Cómo los etiquetaron?',`Rest-Mex 2025: ${miles(D.datos.n_original)} reseñas de TripAdvisor de México (hoteles, restaurantes, atractivos), licencia CC-BY-4.0. 1–2 estrellas = negativo, 3 = neutral, 4–5 = positivo. Es supervisión débil: la etiqueta viene de las estrellas del autor.`, ''],
 ['dat','¿Por qué balancearon las clases? ¿Eso no sesga el modelo?',`El ${pct(D.datos.distribucion_real.positivo)} es positivo. Sin balancear, el modelo puede aprender a decir “positivo” casi siempre y tener ~87% de accuracy sin entender nada. Balanceando, aprende las tres clases por igual. El costo es que su “prior” no coincide con la realidad; por eso lo evalué también sobre una muestra con la distribución real (F1 macro ${dec(B.test_natural.f1_macro)}, accuracy ${pct(B.test_natural.accuracy)}). Alternativas: pesos de clase en la pérdida o ajustar umbrales.`, ''],
 ['dat','¿Por qué F1 macro y no accuracy?',`Accuracy premia a la clase mayoritaria. F1 macro calcula el F1 (media armónica de precisión y recall) por clase y los promedia sin ponderar, así la clase neutral pesa lo mismo que la positiva. Es la métrica coherente con el objetivo: que el modelo sirva para las tres clases.`, ''],
 ['dat','¿Por qué tres clases y no dos o cinco?',`Dos clases es más fácil pero pierde las reseñas mixtas, que son justo las que un negocio necesita revisar. Cinco clases (predecir la estrella exacta) es muy ruidoso: la diferencia entre 4 y 5 estrellas es más del autor que del texto. Tres clases es el punto útil.`, ''],
 ['dat','¿Cómo evitaron fuga de datos?',`Eliminé duplicados exactos antes de dividir; la división es una sola vez con semilla; el tokenizador viene preentrenado (no se ajusta sobre test); los hiperparámetros se eligieron solo con validación; el test natural usa reseñas que no están en el corpus balanceado y el conjunto colombiano nunca se usó para entrenar.`, ''],
 ['dat','¿Qué preprocesamiento hicieron y por qué tan poco?',`Reparar codificación con ftfy, unir título + texto, normalizar espacios y quitar duplicados. No quité stopwords, tildes ni mayúsculas para BETO porque el modelo se preentrenó con texto natural y esas señales (“NO”, “¡¡!!”, “pero”) importan. El TF-IDF sí pasa a minúsculas.`, ''],
 ['res','¿Cumplieron el objetivo?',`Sí: F1 macro de BETO en prueba = <b>${dec(B.test.f1_macro)}</b> (meta 0,70), accuracy ${pct(B.test.accuracy)}. ${EXT?`En el conjunto colombiano obtuvo F1 macro ${dec(EXT.f1_macro)}, una ${EXT.f1_macro<B.test.f1_macro?'caída':'variación'} de ${(Math.abs(B.test.f1_macro-EXT.f1_macro)*100).toFixed(1).replace('.',',')} puntos.`:'La evaluación en Colombia se presenta con el conjunto externo etiquetado a mano.'}`, ''],
 ['res','¿Por qué falla más en la clase neutral?',`Porque es intrínsecamente ambigua: una reseña de 3 estrellas suele mezclar cosas buenas y malas, y lo que para un autor es 3 para otro es 2 o 4. La matriz de confusión muestra que casi todos sus errores van a la clase vecina, no al extremo opuesto. Parte del error es ruido de etiqueta, que pone un techo a cualquier modelo.`, ''],
 ['res','¿Qué tan mejor es que el baseline? ¿Vale la pena?',`TF-IDF + RL logra ${dec(T.test.f1_macro)} en segundos; BETO ${dec(B.test.f1_macro)}. La ganancia está en entender contexto: negaciones, contrastes con “pero”, ironía leve. Si el presupuesto fuera mínimo, TF-IDF es un baseline digno; para producción con miles de reseñas, BETO en una GPU es viable y la mejora es significativa.`, ''],
 ['res','¿Qué es el cambio de dominio y por qué esperaban degradación en Colombia?',`El modelo aprendió de TripAdvisor México, mayormente turismo. En Google Maps de Colombia cambian: <b>país</b> (léxico: “bacano”, “parce”, “tesos”, “tinto”), <b>plataforma</b> (reseñas de Google más cortas e informales) y <b>tipo de negocio</b> (barberías, veterinarias, talleres que no estaban en el entrenamiento). Todo eso cambia la distribución de entrada respecto a la de entrenamiento.`, ''],
 ['res','¿Por qué en Colombia les fue mejor que en México? ¿No es sospechoso?',`Sí, hay que explicarlo. BETO sacó ${D.externo?dec(D.externo.f1_macro.beto):'—'} en Colombia y ${dec(B.test.f1_macro)} en México. (1) En Colombia las etiquetas son <b>manuales</b> y limpias; en México vienen de las estrellas y tienen ruido (reseñas de 1 estrella que elogian). (2) Para encontrar negativas tomamos las de calificación más baja, que son quejas muy claras. (3) Hay pocas neutrales, la clase difícil. (4) Son solo ${D.externo?D.externo.n:'—'} reseñas: el intervalo de confianza de BETO va de ${D.externo?dec(D.externo.ic95_f1.beto[0]):'—'} a ${D.externo?dec(D.externo.ic95_f1.beto[1]):'—'}. Conclusión honesta: no vimos una degradación fuerte, pero la muestra no permite afirmar que generalice “mejor”.`, 'Si te preguntan qué harías: un conjunto externo más grande, con varias personas etiquetando, y medir el acuerdo entre ellas (kappa de Cohen).'],
 ['res','En Colombia DistilBERT sacó más que BETO. ¿Entonces BETO no es mejor?',`En el test grande de México (${miles(D.datos.tamanos.test)} reseñas) BETO gana con claridad. En Colombia DistilBERT sacó ${D.externo?dec(D.externo.f1_macro.mdistilbert):'—'} y BETO ${D.externo?dec(D.externo.f1_macro.beto):'—'}, pero con ${D.externo?D.externo.n:'—'} reseñas la diferencia no es significativa: el intervalo del 95% de la diferencia BETO − DistilBERT va de ${D.externo?dec(D.externo.ic95_diferencia_beto_menos.mdistilbert[0]):'—'} a ${D.externo?dec(D.externo.ic95_diferencia_beto_menos.mdistilbert[1]):'—'} e incluye el cero. Además, todos los errores de BETO allí son llamar “neutral” a reseñas cortas y tibias, nunca confundir negativo con positivo.`, 'Palabra clave: “bootstrap”. Remuestreamos las reseñas 2.000 veces con reemplazo para ver cuánto varía el F1.'],
 ['res','¿Qué harían para mejorar el modelo?',`(1) Etiquetar más reseñas colombianas y ajustar con ellas; (2) preentrenamiento adaptativo al dominio: seguir el MLM de BETO con reseñas colombianas sin etiqueta; (3) probar RoBERTa-BNE o XLM-R; (4) pesos de clase o umbrales para la distribución real; (5) limpiar etiquetas ruidosas; (6) ensamble con el baseline.`, ''],
 ['res','¿El modelo entiende sarcasmo?',`Parcialmente. Captura contrastes explícitos (“bonito, pero…”), pero el sarcasmo sin marcas (“excelente, solo esperamos una hora”) sigue siendo un caso de error frecuente. Aparece en el análisis de errores.`, ''],
 ['res','¿Para qué sirve esto en la vida real?',`Para que un negocio con muchas sedes monitoree automáticamente lo que dicen sus clientes, priorice reseñas negativas para responder rápido y mida la evolución del sentimiento por sede, incluso en canales sin estrellas (encuestas, WhatsApp, redes).`, ''],
];
const CATS = {arq:'Arquitectura', ent:'Entrenamiento', dat:'Datos', res:'Resultados'};
function vistaPreguntas(){ return `
<section class="vista">
  <div class="bloque"><span class="eyebrow">Preparación</span><h2>Preguntas probables del profesor</h2>
  <p class="lead">${PREG.length} preguntas con respuesta modelo. Cada una trae primero la idea <b>en palabras simples</b> (para que la entiendas) y luego la respuesta técnica (para decirla). Practica en modo examen: lee la pregunta, respóndela en voz alta y luego compara.</p></div>
  <div class="control" id="modo"><button data-m="lista" aria-pressed="true">Lista</button><button data-m="examen" aria-pressed="false">Modo examen</button></div>
  <div id="zona-preg"></div>
</section>`;}
function renderLista(cat){
  const z=$('#zona-preg');
  z.innerHTML = `<div class="filtros control" style="margin-bottom:12px"><button data-c="" aria-pressed="${!cat}">Todas</button>${Object.entries(CATS).map(([k,v])=>`<button data-c="${k}" aria-pressed="${cat===k}">${v}</button>`).join('')}</div>
  <div class="lista-preguntas">${PREG.filter(p=>!cat||p[0]===cat).map(p=>`<details class="pregunta"><summary><span>${p[1]}</span></summary><div class="resp">${simpleDe(p)}<p>${p[2]}</p>${p[3]?`<p class="tip">${p[3]}</p>`:''}</div></details>`).join('')}</div>`;
  z.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>renderLista(b.dataset.c||null));
}
let orden=[], pos=0, vista=false;
function renderExamen(){
  const z=$('#zona-preg');
  if(!orden.length){ orden=PREG.map((_,i)=>i).sort(()=>Math.random()-.5); pos=0; }
  const p=PREG[orden[pos]];
  z.innerHTML=`<div class="examen"><div class="barra-progreso"><i style="width:${(pos+1)/orden.length*100}%"></i></div>
   <span class="eyebrow">${CATS[p[0]]} · ${pos+1} de ${orden.length}</span>
   <div class="panel tarjeta"><div class="q">${p[1]}</div>${vista?`${simpleDe(p)}<p>${p[2]}</p>${p[3]?`<p class="tip" style="font-size:.9rem;color:var(--muted)">${p[3]}</p>`:''}`:'<p style="color:var(--muted)">Respóndela en voz alta antes de ver la respuesta.</p>'}</div>
   <div class="control"><button id="ex-prev">Anterior</button><button id="ex-ver" aria-pressed="${vista}">${vista?'Ocultar respuesta':'Ver respuesta'}</button><button id="ex-sig">Siguiente</button><span style="flex:1"></span><button id="ex-mezcla">Barajar</button></div></div>`;
  $('#ex-ver').onclick=()=>{vista=!vista;renderExamen();};
  $('#ex-sig').onclick=()=>{pos=(pos+1)%orden.length;vista=false;renderExamen();};
  $('#ex-prev').onclick=()=>{pos=(pos-1+orden.length)%orden.length;vista=false;renderExamen();};
  $('#ex-mezcla').onclick=()=>{orden=[];vista=false;renderExamen();};
}

function vistaGuion(){ return `
<section class="vista">
  <div class="bloque"><span class="eyebrow">Sustentación</span><h2>Guion de exposición (≈ 8 minutos)</h2>
  <p class="lead">Una idea por bloque. Habla del problema antes que de la técnica, y cierra cada bloque con un número.</p></div>
  <ol class="guion">
   <li><span class="t">0:00</span><div><b>Problema.</b> Los negocios reciben muchas reseñas en español; leerlas todas no escala y las estrellas no siempre están o no cuentan todo. Objetivo: clasificar el texto en negativo, neutral o positivo, con meta de F1 macro ≥ 0,70, y ver si funciona en reseñas colombianas.</div></li>
   <li><span class="t">1:00</span><div><b>Datos.</b> Rest-Mex 2025, ${miles(D.datos.n_original)} reseñas de TripAdvisor. Estrellas → 3 clases. Desbalance 87% positivo, por eso balanceé a ${miles(D.datos.por_clase)} por clase y dividí 70/15/15 estratificado. Mostrar la gráfica de estrellas.</div></li>
   <li><span class="t">2:00</span><div><b>Arquitectura.</b> BETO = BERT-base en español. Recorrer las etapas: tokenizador → embeddings → 12 encoders con atención → [CLS] → pooler → lineal 768→3 → softmax. Analogía con VGG preentrenada en ImageNet: mismo principio de transfer learning, otra modalidad.</div></li>
   <li><span class="t">3:30</span><div><b>Entrenamiento.</b> Trainer de Hugging Face, AdamW, lr ${B.hiperparametros.lr}, warmup, fp16, ${Math.round(B.segundos_entrenamiento/60)} min en una RTX 4060. Mostrar curvas: dónde empieza el sobreajuste y por qué me quedo con el mejor checkpoint.</div></li>
   <li><span class="t">4:30</span><div><b>Etapas intermedias.</b> Gráfica de sondas por capa: en los embeddings el [CLS] aún no ha leído nada (azar); el BETO de fábrica ya sabe algo de sentimiento; el ajuste lo concentra en las capas altas. PCA capa 1 vs capa 12.</div></li>
   <li><span class="t">5:30</span><div><b>Resultados.</b> BETO ${dec(B.test.f1_macro)} vs DistilBERT ${dec(M.test.f1_macro)} vs TF-IDF ${dec(T.test.f1_macro)}. Neutral es la clase difícil. Matriz de confusión: errores entre vecinos.</div></li>
   <li><span class="t">6:30</span><div><b>Generalización a Colombia.</b> ${EXT?`${D.externo.n} reseñas de Google Maps en ${D.externo.n_ciudades} ciudades: F1 macro ${dec(EXT.f1_macro)}, sin degradación fuerte. Explicar por qué salió alto (etiquetas manuales, quejas claras, pocas neutrales) y que con esa muestra los modelos no se distinguen (intervalos bootstrap). Mostrar que todos los errores son “hacia neutral” y el ejemplo de 1 estrella con texto elogioso.`:'Resultado del conjunto colombiano.'}</div></li>
   <li><span class="t">7:30</span><div><b>Cierre.</b> Objetivo cumplido, limitaciones (etiquetas débiles, neutral, dominio) y trabajo futuro (adaptación de dominio con reseñas colombianas).</div></li>
  </ol>
</section>`;}

const CAPS = [
 {id:'c-ia', t:'¿Qué problema estamos resolviendo?',
  idea:`Queremos que el computador lea una reseña (“La comida estaba fría y el mesero fue grosero”) y diga si la opinión es <b>negativa</b>, <b>neutral</b> o <b>positiva</b>. A esto se le llama <b>clasificación de sentimiento</b>. “Clasificar” es poner cada cosa en una de varias cajas.`,
  ana:`Es como tener un empleado que lee todos los comentarios de los clientes y los separa en tres montones: quejas, comentarios tibios y elogios. Solo que este empleado es un programa y lee miles por minuto.`,
  pro:`Las tres cajas son nuestras <b>clases</b>. Al modelo le damos texto y nos devuelve una de las tres.`},
 {id:'c-ml', t:'Aprender con ejemplos (Machine Learning)',
  idea:`Nadie le escribe al computador reglas como “si dice <i>delicioso</i> es positivo”. Habría que escribir millones de reglas y siempre fallarían (“nada delicioso”). En cambio, le mostramos <b>miles de ejemplos ya resueltos</b> (reseña + respuesta correcta) y el programa descubre solo los patrones. Eso es <b>aprendizaje automático</b> o <i>machine learning</i>. Como cada ejemplo trae su respuesta correcta, se llama <b>aprendizaje supervisado</b>.`,
  ana:`Así aprende un niño a distinguir perros de gatos: nadie le da una definición, le muestran muchos perros y muchos gatos y le corrigen cuando se equivoca.`,
  pro:`Los ejemplos resueltos salen de TripAdvisor: cada reseña trae sus estrellas, y las estrellas nos dicen la respuesta correcta (1–2 = negativo, 3 = neutral, 4–5 = positivo). Usamos ${miles(D.datos.tamanos.train)} ejemplos para aprender.`},
 {id:'c-neurona', t:'La neurona artificial: la pieza básica',
  idea:`Una <b>neurona artificial</b> es una cuenta muy simple: recibe varios números, multiplica cada uno por un <b>peso</b> (qué tan importante es), los suma, le suma un <b>sesgo</b> y pasa el resultado por una <b>función de activación</b> que decide “cuánto se enciende”. Los pesos son lo que la neurona <b>aprende</b>. Prueba la neurona de juguete de abajo.`,
  ana:`Es como una balanza: cada palabra pone peso en el lado bueno o en el malo, y la balanza se inclina hacia un lado.`,
  pro:`Nuestro modelo tiene unos <b>${(B.parametros_entrenables/1e6).toFixed(0)} millones</b> de estos pesos (se llaman <b>parámetros</b>). La neurona de juguete tiene 12.`, demo:true},
 {id:'c-red', t:'Red neuronal: muchas neuronas en capas',
  idea:`Una sola neurona es muy limitada: la de arriba no entiende “<i>no</i> estaba buena”. Si conectamos muchas neuronas en <b>capas</b> (la salida de una capa es la entrada de la siguiente) la red puede aprender cosas mucho más complejas. Las capas del medio se llaman <b>capas ocultas</b> o <b>etapas intermedias</b>. Cuando hay muchas capas decimos que es <b>aprendizaje profundo</b> (<i>deep learning</i>).`,
  ana:`Es una cadena de montaje: la primera estación detecta piezas simples (palabras), las siguientes combinan piezas (frases como “no estaba buena”) y la última toma la decisión final.`,
  pro:`BETO tiene 12 capas principales apiladas. En la pestaña <a href="#capas">Etapas intermedias</a> medimos qué sabe cada una.`},
 {id:'c-aprende', t:'¿Cómo aprende? Error, gradiente y learning rate',
  idea:`Al principio los pesos son casi al azar y la red se equivoca. En cada paso: (1) la red predice; (2) medimos qué tan mal lo hizo con una <b>función de pérdida</b> (<i>loss</i>), un número que es grande si se equivocó mucho; (3) calculamos hacia dónde mover cada peso para que la pérdida baje (eso es el <b>gradiente</b>, y el cálculo hacia atrás por las capas se llama <b>backpropagation</b>); (4) movemos los pesos un poquito en esa dirección. Repetimos miles de veces. Ese “poquito” es el <b>learning rate</b> (tasa de aprendizaje).`,
  ana:`Estás en una montaña con niebla y quieres bajar al valle. No ves el valle, pero sientes con los pies hacia dónde baja el suelo y das un paso. El tamaño del paso es el learning rate: pasos enormes te hacen saltar al otro lado; pasos diminutos tardan una eternidad.`,
  pro:`Pérdida = <b>entropía cruzada</b>. Optimizador (el que da los pasos) = <b>AdamW</b>. Learning rate = ${B.hiperparametros.lr} (muy pequeño a propósito, ver “Fine-tuning”).`},
 {id:'c-epoca', t:'Lote, época y GPU',
  idea:`No le mostramos los ${miles(D.datos.tamanos.train)} ejemplos de una vez: los partimos en grupitos de ${B.hiperparametros.batch} llamados <b>lotes</b> (<i>batch</i>). Cada lote = un paso de aprendizaje. Cuando la red ya vio todos los ejemplos una vez, completó una <b>época</b>. Las cuentas se hacen en una <b>GPU</b> (tarjeta de video) porque hace miles de multiplicaciones a la vez.`,
  ana:`Estudiar un libro de ejercicios: cada sesión haces ${B.hiperparametros.batch} ejercicios y corriges; terminar el libro entero es una época.`,
  pro:`${miles(D.datos.tamanos.train)} / ${B.hiperparametros.batch} ≈ ${Math.ceil(D.datos.tamanos.train/B.hiperparametros.batch)} pasos por época. El mejor modelo apareció antes de terminar la segunda época. Todo corrió en tu RTX 4060 en ${Math.round(B.segundos_entrenamiento/60)} minutos.`},
 {id:'c-split', t:'Entrenamiento, validación y prueba',
  idea:`Si evaluamos al modelo con los mismos ejemplos con que aprendió, no sabemos si entendió o si memorizó. Por eso partimos los datos en tres grupos que no se mezclan: <b>entrenamiento</b> (70%, para aprender), <b>validación</b> (15%, para tomar decisiones mientras ajustamos) y <b>prueba</b> (15%, se usa una sola vez al final para dar la nota).`,
  ana:`Entrenamiento = los ejercicios del libro. Validación = los simulacros antes del examen (te ayudan a decidir cómo estudiar). Prueba = el examen final, que no has visto nunca.`,
  pro:`${miles(D.datos.tamanos.train)} / ${miles(D.datos.tamanos.val)} / ${miles(D.datos.tamanos.test)} reseñas. La división es <b>estratificada</b>: cada grupo tiene la misma proporción de cada clase.`},
 {id:'c-overfit', t:'Sobreajuste (overfitting)',
  idea:`Si entrenamos demasiado, la red empieza a <b>memorizar</b> los ejemplos de entrenamiento en vez de aprender reglas generales. Se nota porque el error en entrenamiento sigue bajando pero el de validación empieza a subir. Para evitarlo: paramos a tiempo (<b>early stopping</b>), guardamos la mejor versión vista en validación (<b>checkpoint</b>) y apagamos neuronas al azar durante el entrenamiento (<b>dropout</b>) para que no dependa de ninguna en particular.`,
  ana:`El estudiante que se aprende de memoria las respuestas del libro saca 5 en los ejercicios y se raja en el examen porque las preguntas son distintas.`,
  pro:`En la pestaña <a href="#entrenamiento">Entrenamiento</a> la curva roja (error en validación) baja y luego sube: ese punto de giro es donde empieza el sobreajuste, y ahí nos quedamos con el modelo.`},
 {id:'c-hiper', t:'Parámetros vs hiperparámetros',
  idea:`<b>Parámetros</b> = los pesos que la red aprende sola (${(B.parametros_entrenables/1e6).toFixed(0)} millones). <b>Hiperparámetros</b> = las perillas que elegimos nosotros antes de entrenar: learning rate, tamaño de lote, número de épocas, longitud máxima del texto. Los hiperparámetros se eligen probando varias opciones y mirando cuál da mejor resultado en <b>validación</b>.`,
  ana:`En una receta, los parámetros serían lo que el cocinero va ajustando al probar; los hiperparámetros, la temperatura del horno y el tiempo, que fijas antes de meter el pastel.`,
  pro:`Probamos learning rates de 2e-5, 3e-5 y 5e-5, y longitudes de 128 y 256 tokens. Ganó 2e-5 con 256.`},
 {id:'c-texto', t:'¿Cómo lee texto una red? Tokens y embeddings',
  idea:`La red solo entiende números. Primero un <b>tokenizador</b> parte el texto en pedacitos llamados <b>tokens</b> (palabras o pedazos de palabra: “lentísimo” → “lent” + “##ísimo”) y le da a cada uno un número de su diccionario. Después cada número se cambia por un <b>embedding</b>: una lista de 768 números que representa el significado del token. Palabras parecidas (“excelente”, “buenísimo”) quedan con listas parecidas.`,
  ana:`Un embedding es como las coordenadas GPS de una palabra en un “mapa de significados”: “rico”, “delicioso” y “sabroso” viven en el mismo barrio; “horrible” vive lejos.`,
  pro:`Diccionario de BETO: 31.002 tokens. Cada reseña se corta en máximo ${B.hiperparametros.max_len} tokens. Ver la etapa 1 y 2 en <a href="#arquitectura">Arquitectura</a>.`},
 {id:'c-familias', t:'Familias de redes: CNN (VGG), RNN y Transformer',
  idea:`Hay tipos de redes para cada tipo de dato. <b>CNN</b> (redes convolucionales, como <b>VGG</b> o <b>ResNet</b>): pasan pequeñas “lupas” de 3×3 píxeles por una imagen para detectar bordes, luego texturas, luego formas; son las reinas de las <b>imágenes</b>. <b>RNN/LSTM</b>: leen el texto palabra por palabra, con una “memoria” que se va olvidando en textos largos. <b>Transformer</b>: lee todas las palabras a la vez y deja que cada palabra “mire” a todas las demás (eso es la <b>atención</b>). Hoy los Transformers son los mejores para texto.`,
  ana:`La CNN es un ojo que mira una foto por zonas. La LSTM es alguien leyendo en voz alta sin poder volver atrás. El Transformer es alguien que ve la frase completa y subraya qué palabras se relacionan entre sí.`,
  pro:`Usamos un Transformer (BETO), <b>no</b> VGG, porque nuestro dato es texto, no imágenes. Lo que sí copiamos de la forma en que se usa VGG es la idea de partir de una red ya entrenada (siguiente capítulo).`},
 {id:'c-atencion', t:'La atención, explicada con una frase',
  idea:`En “La comida estaba deliciosa <b>pero</b> el servicio fue lentísimo”, para entender el sentimiento hay que conectar “pero” con lo que viene después, y “lentísimo” con “servicio”. La <b>atención</b> calcula, para cada palabra, cuánto debe fijarse en cada una de las otras, y mezcla su información según esos porcentajes. BETO lo hace con 12 “cabezas” a la vez, cada una especializada en un tipo de relación (quién hace qué, qué adjetivo va con qué sustantivo, negaciones…).`,
  ana:`Cuando lees “ella se lo dio a él”, tu cerebro automáticamente busca a quién se refiere “ella” y “él” en la frase anterior. Eso es atención.`,
  pro:`Hay 12 capas y cada una tiene 12 cabezas de atención. En <a href="#capas">Etapas intermedias</a> puedes ver a qué palabras le presta atención el modelo final.`},
 {id:'c-transfer', t:'Preentrenamiento y transfer learning',
  idea:`Entrenar una red grande desde cero necesita miles de millones de palabras y semanas de cómputo. La solución: alguien ya entrenó una red gigante para una tarea general (adivinar palabras tapadas en millones de textos en español), y en el camino aprendió gramática, vocabulario y mucho del significado. Nosotros <b>reutilizamos</b> esa red y solo le enseñamos nuestra tarea. Eso es <b>transfer learning</b> (transferencia de aprendizaje).`,
  ana:`Contratar a alguien que ya habla español perfecto y solo enseñarle a clasificar reseñas, en lugar de enseñarle a hablar desde bebé. En imágenes se hace igual: se toma una <b>VGG ya entrenada con ImageNet</b> (14 millones de fotos) y se adapta para, por ejemplo, detectar enfermedades en hojas.`,
  pro:`BETO fue preentrenado por la Universidad de Chile con ~3.000 millones de palabras en español. Nosotros lo adaptamos con ${miles(D.datos.tamanos.train)} reseñas.`},
 {id:'c-bert', t:'BERT y BETO',
  idea:`<b>BERT</b> (Google, 2018) es un Transformer famoso que se preentrena tapando palabras al azar y adivinándolas mirando el contexto de los dos lados. <b>BETO</b> es un BERT entrenado <b>solo con texto en español</b>, así que entiende mejor nuestro idioma que las versiones multilingües, que reparten su “cerebro” entre 100 idiomas.`,
  ana:`BERT es un lector que se volvió experto haciendo millones de ejercicios de “complete la palabra que falta: El perro ___ al cartero”.`,
  pro:`Lo comparamos con DistilBERT multilingüe (una versión reducida que sabe 104 idiomas): BETO ganó por ${((B.test.f1_macro-M.test.f1_macro)*100).toFixed(1).replace('.',',')} puntos.`},
 {id:'c-finetune', t:'Fine-tuning (ajuste fino)',
  idea:`Al BETO preentrenado le ponemos encima una capa nueva y pequeña (de 768 números a 3, una salida por clase) y seguimos entrenando <b>todo</b> con nuestras reseñas, pero con un learning rate muy pequeño para no “borrarle” lo que ya sabía. Esto es <b>fine-tuning</b>. La capa final da tres números y la <b>softmax</b> los convierte en probabilidades que suman 100% (p. ej. negativo 5%, neutral 15%, positivo 80%).`,
  ana:`Afinar una guitarra que ya está casi afinada: giras las clavijas apenas un poco. Si las giras mucho, la desafinas.`,
  pro:`Learning rate ${B.hiperparametros.lr}, ${Math.round(B.segundos_entrenamiento/60)} minutos. Comparado con dejar BETO congelado y entrenar solo la capa final, ajustar todo da bastante mejor resultado.`},
 {id:'c-metricas', t:'¿Cómo sabemos si es bueno? Las métricas',
  idea:`<b>Accuracy</b> (exactitud): de todas las reseñas, qué porcentaje acertó. <b>Precisión</b> de una clase: de las que el modelo dijo “negativo”, cuántas lo eran. <b>Recall</b> (sensibilidad) de una clase: de las que realmente eran negativas, cuántas encontró. <b>F1</b>: un promedio especial de precisión y recall que solo es alto si ambos lo son. <b>F1 macro</b>: el F1 de cada clase promediado, para que las tres clases cuenten igual. La <b>matriz de confusión</b> es una tabla que muestra qué confundió con qué.`,
  ana:`Un detector de incendios con mucha precisión casi nunca da falsas alarmas; con mucho recall nunca deja pasar un incendio. Quieres las dos cosas, y eso mide el F1.`,
  pro:`F1 macro de BETO en prueba: <b>${dec(B.test.f1_macro)}</b> (la meta era 0,70). Usamos F1 macro y no solo accuracy porque en la vida real el 87% de las reseñas son positivas: un modelo que dijera siempre “positivo” tendría 87% de accuracy sin servir para nada.`},
 {id:'c-baseline', t:'Baselines: ¿contra qué nos comparamos?',
  idea:`Un número solo (“80%”) no dice si algo es bueno. Por eso se compara contra modelos de referencia (<b>baselines</b>). El más simple, <b>TF-IDF + regresión logística</b>, no es una red profunda: cuenta qué palabras aparecen (dando más peso a las palabras raras e informativas) y aprende un peso por palabra. Es rápido y sorprendentemente bueno, pero no entiende el orden ni el contexto.`,
  ana:`Antes de decir que un carro nuevo es rápido, lo comparas con uno normal en la misma pista.`,
  pro:`TF-IDF: ${dec(T.test.f1_macro)} en ${T.segundos_entrenamiento} segundos. BETO: ${dec(B.test.f1_macro)}. La red profunda gana, sobre todo en la clase neutral.`},
 {id:'c-dominio', t:'Cambio de dominio',
  idea:`Un modelo funciona mejor con textos parecidos a los que vio al entrenar. Si cambia el país, la plataforma o el tipo de negocio, cambian las palabras y el estilo, y el rendimiento suele bajar. A eso se le llama <b>cambio de dominio</b> (<i>domain shift</i>).`,
  ana:`Un mesero que aprendió a atender en un restaurante de Ciudad de México y lo pasan a una barbería en Medellín: sabe mucho, pero “bacano”, “parce” o “qué chimba” lo van a confundir.`,
  pro:`Entrenamos con TripAdvisor México y evaluamos con Google Maps Colombia para medir cuánto se pierde.`},
];
function demoNeurona(){ return `<div id="neurona" class="panel bloque">
  <h3>Neurona de juguete</h3>
  <p style="color:var(--muted)">Escribe una reseña. Cada palabra conocida aporta su peso; la neurona suma y la activación convierte la suma en una puntuación de 0 a 1.</p>
  <label for="txt-neurona" class="eyebrow">Tu reseña</label>
  <textarea id="txt-neurona">La comida estaba deliciosa pero el servicio fue lento</textarea>
  <div id="res-neurona" class="bloque"></div>
  <p style="color:var(--muted);font-size:.9rem">Prueba “la comida no estaba buena”: la neurona suma el +2 de “buena” y se equivoca porque no entiende que “no” cambia el sentido. Para eso se necesitan muchas capas y atención.</p></div>`;}
const PESOS_JUGUETE = {excelente:3, deliciosa:2.5, delicioso:2.5, buena:2, bueno:2, rico:2, recomendado:2, amables:1.5, lento:-1.5, lenta:-1.5, fría:-1.5, frio:-1.5, malo:-2, mala:-2, grosero:-2.5, pésimo:-3, horrible:-3, pero:-0.3};
function pintarNeurona(){
  const t=$('#txt-neurona').value.toLowerCase().normalize('NFC');
  const pal=t.match(/[a-záéíóúñü]+/g)||[]; const usadas=pal.filter(p=>p in PESOS_JUGUETE);
  const sesgo=0.2, s=usadas.reduce((a,p)=>a+PESOS_JUGUETE[p],sesgo), y=1/(1+Math.exp(-s));
  const cls = y<0.35?['negativo','c-neg']:y<0.65?['neutral','c-neu']:['positivo','c-pos'];
  $('#res-neurona').innerHTML=`<div class="fila-tokens">${usadas.length?usadas.map(p=>`<span class="tok">${p} <b class="${PESOS_JUGUETE[p]>0?'c-pos':'c-neg'}">${PESOS_JUGUETE[p]>0?'+':''}${String(PESOS_JUGUETE[p]).replace('.',',')}</b></span>`).join(''):'<span style="color:var(--muted)">Ninguna palabra conocida (prueba: excelente, buena, horrible, grosero, lento…)</span>'}</div>
   <div class="formula">suma = ${usadas.map(p=>String(PESOS_JUGUETE[p]).replace('.',',')).join(' + ')||'0'} + sesgo 0,2 = ${s.toFixed(1).replace('.',',')}   →   activación sigmoide(${s.toFixed(1).replace('.',',')}) = ${y.toFixed(2).replace('.',',')}</div>
   <div class="barra-neurona" aria-hidden="true"><i style="left:calc(${(y*100).toFixed(1)}% - 2px)"></i></div>
   <p>Decisión: <b class="${cls[1]}">${cls[0]}</b></p>`;
}
const SIMPLE = {
 '¿Qué arquitectura usaron':'Usamos una red ya entrenada en español (BETO) y le enseñamos a clasificar reseñas. “Arquitectura” = el diseño de la red: cuántas capas tiene y cómo se conectan.',
 '¿Usaron VGG':'VGG es una red famosa para fotos. Nosotros trabajamos con texto, así que usamos otra familia de redes (Transformer). Pero sí usamos el mismo truco que se usa con VGG: partir de una red ya entrenada.',
 '¿Cuáles son las etapas intermedias':'Son los pasos por los que pasa la reseña dentro de la red, desde el texto hasta la respuesta: partir en pedacitos → convertir en números → 12 capas que “leen” y relacionan palabras → resumen → decisión.',
 '¿Qué aprende cada etapa':'Medimos qué tanto “sabe” de sentimiento cada capa. Las primeras saben poco; las últimas saben mucho. Y el modelo sin entrenar con reseñas ya sabía algo, porque leyó mucho español.',
 '¿Cómo funciona la auto-atención':'Cada palabra decide en qué otras palabras fijarse para entender su significado en esa frase, y toma información de ellas según cuánto se fijó.',
 '¿Por qué se divide por':'Es un ajuste numérico para que los porcentajes de atención no se vuelvan extremos (todo en una sola palabra) y la red pueda seguir aprendiendo.',
 '¿Qué es el token [CLS]':'Es una “palabra” falsa que ponemos al inicio. Durante la lectura va recogiendo información de toda la reseña, y al final la usamos como resumen para decidir.',
 '¿Qué son las conexiones residuales':'Atajos que dejan pasar la información original junto a la procesada, para que en una red de muchas capas no se pierda la señal. LayerNorm mantiene los números en una escala estable.',
 '¿Cómo sabe el modelo el orden':'A cada palabra se le suma una “etiqueta de posición” (1ª, 2ª, 3ª…). Sin eso, “el perro mordió al hombre” y “el hombre mordió al perro” serían iguales para la red.',
 '¿Qué activación usa':'La activación es la pequeña función que decide cuánto se “enciende” cada neurona después de sumar. Sin ella, apilar capas no serviría de nada (todo sería una sola suma).',
 '¿Por qué un Transformer':'La LSTM lee palabra por palabra y se le olvida el principio en frases largas; el Transformer ve toda la frase a la vez. Y ya existen Transformers entrenados en español.',
 '¿Por qué BETO y no':'BETO solo sabe español, así que conoce mejor nuestro idioma que modelos que reparten su conocimiento entre 100 idiomas. Y es mucho más barato que un ChatGPT para algo tan concreto.',
 '¿Qué es WordPiece':'Es la forma de partir el texto: palabras comunes enteras y palabras raras en pedazos. Así cualquier palabra, incluso inventada, se puede representar.',
 '¿Qué significa “cased”':'“Cased” = distingue mayúsculas (PÉSIMO ≠ pésimo). “Whole Word Masking” = cómo aprendió español: tapando palabras completas y adivinándolas.',
 '¿Qué es fine-tuning':'Tomar la red ya entrenada y seguir entrenándola un poquito con nuestros ejemplos. No “congelamos” (bloqueamos) ninguna parte: todo se ajusta, pero suavemente.',
 '¿Por qué un learning rate':'El learning rate es el tamaño del paso al corregir. Si es grande, la red “olvida” todo lo que sabía de español; por eso pasos muy pequeños.',
 '¿Cómo eligieron los hiperparámetros':'Probamos varias configuraciones y nos quedamos con la que mejor le fue en los “simulacros” (validación), sin mirar el examen final (prueba).',
 '¿Qué optimizador':'El optimizador es el método que decide cómo corregir los pesos en cada paso. La pérdida es el número que mide qué tan mal lo hizo la red.',
 '¿Qué es el warmup':'Al principio damos pasos muy pequeños y los vamos agrandando, para no dañar a la red mientras la capa nueva todavía está diciendo cosas al azar.',
 '¿Hubo sobreajuste':'Sí, si entrenábamos de más la red empezaba a memorizar. Lo detectamos con validación y nos quedamos con la versión de antes de que empezara a memorizar.',
 '¿Por qué max_len':'Es cuántos pedacitos de texto lee como máximo por reseña. Más largo = lee más pero tarda más. Con 256 casi ninguna reseña queda cortada.',
 '¿Cuánto tardó':'Unos minutos en una tarjeta de video de portátil, porque partimos de una red ya entrenada.',
 '¿Qué es fp16':'Hacer las cuentas con números de menos decimales para ir el doble de rápido y usar menos memoria, sin perder calidad.',
 '¿Cómo aseguran reproducibilidad':'Fijamos el “azar” con una semilla, así si alguien corre el código obtiene los mismos resultados.',
 '¿De dónde salen los datos':'De reseñas reales de TripAdvisor en México, públicas para investigación. Las estrellas nos dan la respuesta correcta.',
 '¿Por qué balancearon':'Casi todas las reseñas son positivas. Si no igualamos, la red aprende a decir siempre “positivo”. Igualamos las tres clases para que aprenda a reconocerlas todas.',
 '¿Por qué F1 macro':'Porque el porcentaje de aciertos engaña cuando una clase es mucho más común. F1 macro le da la misma importancia a las tres clases.',
 '¿Por qué tres clases':'Dos clases dejan fuera las opiniones mixtas; cinco (las estrellas exactas) son demasiado subjetivas. Tres es el punto útil.',
 '¿Cómo evitaron fuga':'“Fuga” es que el modelo vea, sin querer, datos del examen mientras estudia. Lo evitamos quitando repetidos y separando los grupos una sola vez.',
 '¿Qué preprocesamiento':'Arreglamos letras dañadas (tildes mal guardadas) y unimos título y texto. No quitamos tildes ni mayúsculas porque le dan información a la red.',
 '¿Cumplieron el objetivo':'Sí: la meta era 0,70 y obtuvimos más de 0,80.',
 '¿Por qué falla más en la clase neutral':'Porque “más o menos” es difícil hasta para una persona: una reseña de 3 estrellas mezcla cosas buenas y malas.',
 '¿Qué tan mejor es que el baseline':'El método simple cuenta palabras; BETO entiende contexto (“no está bueno”, “bonito pero caro”). Eso le da varios puntos de ventaja.',
 '¿Qué es el cambio de dominio':'El modelo aprendió con reseñas mexicanas de TripAdvisor; en Google Maps colombiano cambian las palabras y el estilo, y eso lo puede confundir.',
 '¿Por qué en Colombia les fue mejor':'Porque el examen colombiano fue “más fácil” en algunos sentidos: respuestas revisadas a mano, quejas muy claras y pocas opiniones tibias. Y con pocas reseñas el resultado puede variar bastante por azar.',
 'En Colombia DistilBERT sacó más':'Con 166 reseñas, una diferencia de 3–4 puntos puede ser pura suerte. Para saberlo repetimos el cálculo miles de veces con muestras al azar (bootstrap): la diferencia a veces favorece a uno y a veces al otro.',
 '¿Qué harían para mejorar':'Sobre todo, darle reseñas colombianas para que aprenda nuestra forma de escribir.',
 '¿El modelo entiende sarcasmo':'A medias: entiende “bonito pero caro”, pero un sarcasmo sin pistas (“excelente, solo esperé una hora”) lo puede engañar.',
 '¿Para qué sirve esto':'Para que un negocio sepa automáticamente qué dicen sus clientes y atienda primero las quejas.',
};
function simpleDe(p){ const k=Object.keys(SIMPLE).find(k=>p[1].startsWith(k)); return k?`<div class="simple"><b class="et">En palabras simples</b><p>${SIMPLE[k]}</p></div>`:''; }

function bloqueCodigo(arch, b){
  const lineas = (D.codigo && D.codigo[arch.f] || '').split('\n');
  const trozo = lineas.slice(b.r[0]-1, b.r[1]).map((l,i)=>`<span class="ln">${b.r[0]+i}</span>${esc(l)}`).join('\n');
  return `<article class="bloque-codigo"><div class="cab"><h3>${b.t}</h3><span class="pill">líneas ${b.r[0]}${b.r[1]>b.r[0]?'–'+b.r[1]:''}</span></div>
   <pre class="codigo"><code>${trozo}</code></pre>
   <div class="explica"><span class="eyebrow">Qué hace</span><div>${b.q}</div></div>
   <div class="simple"><b class="et">En palabras simples</b><p>${b.s}</p></div></article>`;
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pintarArchivo(i){
  const a = ARCHIVOS[i];
  document.querySelectorAll('#ctrl-arch button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.i==i));
  $('#arch').innerHTML = `<div class="bloque"><span class="eyebrow">Archivo ${i+1} de ${ARCHIVOS.length}</span><h2><code>${a.f}</code></h2><p class="lead">${a.rol}</p>
   <div class="formula">${esc(a.correr)}</div></div>${a.bloques.map(b=>bloqueCodigo(a,b)).join('')}
   ${i<ARCHIVOS.length-1?`<button class="siguiente" data-sig="${i+1}">Siguiente archivo: ${ARCHIVOS[i+1].f} →</button>`:''}`;
  const s = document.querySelector('[data-sig]'); if(s) s.onclick=()=>{pintarArchivo(+s.dataset.sig); $('#arch').scrollIntoView({block:'start'});};
}

 ['F1 macro','Promedio sin ponderar del F1 de cada clase.'],
 ['Recall','De los casos reales de una clase, qué fracción encontró el modelo.'],
 ['Precisión','De lo que el modelo dijo que era una clase, qué fracción lo era.'],
 ['Sonda lineal','Clasificador lineal entrenado sobre representaciones congeladas para medir qué información contienen.'],
 ['Domain shift','Diferencia entre la distribución de entrenamiento y la de uso real.'],
 ['TF-IDF','Peso de un término: frecuencia en el documento × rareza en el corpus.'],
 ['fp16','Precisión mixta: cálculo en 16 bits con copia maestra en 32 bits.'],
]; return `<section class="vista"><div class="bloque"><span class="eyebrow">Referencia</span><h2>Glosario</h2></div>
<dl class="glosario">${G.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
<div class="bloque"><h3>Referencias</h3><ul class="limpia" style="color:var(--muted)">
<li>Vaswani et al. (2017). Attention Is All You Need.</li><li>Devlin et al. (2019). BERT: Pre-training of Deep Bidirectional Transformers.</li>
<li>Cañete et al. (2020). Spanish Pre-Trained BERT Model and Evaluation Data (BETO).</li><li>Sanh et al. (2019). DistilBERT, a distilled version of BERT.</li>
<li>Tenney et al. (2019). BERT Rediscovers the Classical NLP Pipeline.</li><li>Rest-Mex 2025 (IberLEF), corpus de reseñas turísticas de México.</li></ul></div></section>`;}

const VISTAS = {'desde-cero':vistaDesdeCero, resumen:vistaResumen, datos:vistaDatos, arquitectura:vistaArquitectura, capas:vistaCapas, entrenamiento:vistaEntrenamiento, resultados:vistaResultados, codigo:vistaCodigo, preguntas:vistaPreguntas, guion:vistaGuion, glosario:vistaGlosario};

function mostrar(){
  const id = (location.hash||'#desde-cero').slice(1);
  const v = VISTAS[id] ? id : 'desde-cero';
  $('#app').innerHTML = VISTAS[v]();
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current', a.dataset.v===v?'page':'false'));
  const act = document.querySelector(`#nav a[data-v="${v}"]`); if(act) act.scrollIntoView({block:'nearest',inline:'nearest'});
  if(v==='desde-cero'){
    $('#txt-neurona').addEventListener('input', pintarNeurona); pintarNeurona();
    document.querySelectorAll('[data-ir]').forEach(a=>a.onclick=e=>{e.preventDefault(); document.getElementById(a.dataset.ir).scrollIntoView({behavior:'smooth',block:'start'});});
  }
  if(v==='arquitectura'){
    const pintar=i=>{const e=ETAPAS[i]; $('#det').innerHTML=`<span class="eyebrow">Etapa ${e.n} · salida ${e.f}</span><h3>${e.t}</h3>${e.d}`;
      document.querySelectorAll('.pila button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.et==i));};
    document.querySelectorAll('.pila button').forEach(b=>b.onclick=()=>pintar(+b.dataset.et)); pintar(1);
  }
  if(v==='capas' && D.capas){
    let capa='12', modo='ft';
    const pintarPCA=()=>{$('#pca').innerHTML=graficoPCA(capa,modo);
      document.querySelectorAll('#ctrl-pca [data-capa]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.capa===capa));
      document.querySelectorAll('#ctrl-pca [data-modo]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.modo===modo));};
    document.querySelectorAll('#ctrl-pca [data-capa]').forEach(b=>b.onclick=()=>{capa=b.dataset.capa;pintarPCA();});
    document.querySelectorAll('#ctrl-pca [data-modo]').forEach(b=>b.onclick=()=>{modo=b.dataset.modo;pintarPCA();});
    pintarPCA();
    const pintarAtt=i=>{const a=D.capas.atencion[i]; const mx=Math.max(...a.pesos.slice(1,-1));
      $('#att').innerHTML=a.tokens.map((t,j)=>`<span class="tok" style="background:color-mix(in srgb,var(--accent) ${Math.round(Math.min(1,a.pesos[j]/mx)*80)}%,var(--surface-2));color:${a.pesos[j]/mx>.55?'var(--surface)':'var(--fg)'}" title="${dec(a.pesos[j])}">${t}</span>`).join('');
      document.querySelectorAll('#ctrl-att button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.i==i));};
    document.querySelectorAll('#ctrl-att button').forEach(b=>b.onclick=()=>pintarAtt(+b.dataset.i)); pintarAtt(0);
  }
  if(v==='codigo'){ document.querySelectorAll('#ctrl-arch button').forEach(b=>b.onclick=()=>pintarArchivo(+b.dataset.i)); pintarArchivo(0); }
  if(v==='preguntas'){
    const set=m=>{document.querySelectorAll('#modo button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m)); m==='lista'?renderLista(null):renderExamen();};
    document.querySelectorAll('#modo button').forEach(b=>b.onclick=()=>set(b.dataset.m)); set('lista');
  }
}
$('#nav').innerHTML = SECCIONES.map(([id,t])=>`<a href="#${id}" data-v="${id}">${t}</a>`).join('');
window.addEventListener('hashchange', ()=>{ mostrar(); window.scrollTo(0,0); });
mostrar();
</script>
